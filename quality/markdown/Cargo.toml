[package]
name = "quality_markdown"
version = "0.0.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[lib]
name = "quality_markdown"
path = "src/lib.rs"

[[bin]]
name = "quality_markdown"
path = "src/main.rs"
