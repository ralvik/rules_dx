# Private pure-JavaScript tool graph (ESLint + Prettier, hub `npm_tools`).
# `packages` stays explicit so pnpm never treats the file as an empty
# workspace; only this importer participates (see docs/tools/tool-acquisition.md).
# allowBuilds stays empty: both packages are pure JS with no lifecycle
# hooks; any future native dep must opt in explicitly here (fail-closed
# per tool-acquisition private-graph requirements).
packages:
  - .
allowBuilds: {}
