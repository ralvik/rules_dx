# Editor-discovery shim for the own-tree Vale policy: editors and
# language servers discover `.vale.ini` upward from the edited file, so
# the repository root carries this shim. Bazel actions keep binding the
# canonical `quality/corpus_vale.ini` explicitly and never
# ambient-search. `StylesPath` resolves relative to this file, so it
# points at `quality/corpus_styles`. Keep the binding in sync with the
# canonical config; see `//tools/ci:config_consistency_test`.
StylesPath = quality/corpus_styles
MinAlertLevel = suggestion

[*]
BasedOnStyles = Dx
