# Consumer caller template (M27 delivery): pins the qualified reusable workflow.
# Copy to .github/workflows/ci.yml in the consumer repo; do not copy per-check logic.
# Reviewed pin bumps only; customizations (disabled_checks, platforms) preserved across bumps.
# Required repository settings (documented separately, not configured here):
# - approval policy: all_external_contributors for fork runs
# - branch protection: require dx-ci aggregate + up-to-date-branch (or merge queue)
# - permissions: contents read; checks/write + PR write granted to reusable jobs only
name: ci
on:
  pull_request: {}
  push:
    branches: [$default-branch]
  workflow_dispatch: {}
jobs:
  dx:
    uses: rules_dx/.github/workflows/reusable-consumer.yml@v0.1.0
    with:
      rules_dx_version: "0.1.0"
      disabled_checks: ""
      platforms: '["linux_x86_64"]'
      scheduling_mode: "parallel"
      code_scanning_opt_in: false
    secrets: inherit
