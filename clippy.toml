# Clippy single source of truth (issues #239, #238).
#
# Warnings are already errors via
# `--@rules_rust//rust/settings:extra_rustc_flags=--deny=warnings` in
# `.bazelrc` (issue #82); third-party `crate_universe` targets stay green
# via per-target `--cap-lints=allow`. This file documents lint intent, it
# does not yet enforce new lints globally: `clippy::unwrap_used` /
# `clippy::expect_used` deny outside `#[cfg(test)]` rolls out per crate in
# #238 as each crate's non-test code goes `expect`/`unwrap`-free, via
# `#![cfg_attr(not(test), deny(clippy::expect_used, clippy::unwrap_used))]`
# at the crate root (`cfg_attr(not(test))` keeps `rust_test` bodies
# ergonomic). All `cli/*` crates now carry the deny (verified zero
# `.expect(`/`.unwrap(` in non-test code via `rg` before the `#[cfg(test)]`
# marker, with `exec/test_support.rs` exempt as `#[cfg(test)]`-only):
# `dx_digest`, `dx_diff`, `dx_bep`, `dx_atomic_fs`, `dx_fingerprint`,
# `dx_path`, `dx_schema`, `dx_proto_validate`, `dx_qualification`,
# `dx_docgen`, plus `dx_adopt`, `dx_apply`, `dx_audit`, `dx_ci`,
# `dx_clean`, `dx_cli` (+ `dx`/`dx_man` binaries), `dx_codegen`, `dx_env`
# (+ `env` binary), `dx_env_plan`, `dx_lcov`, `dx_output`, `dx_process`,
# `dx_roots`, `dx_setup`, `dx_update`, and test-only `dx_test_scratch`.
# Adding the deny to a crate with
# remaining infallible paths (e.g. `dx_cli reports`/`finalize` before
# 1302877/b2c0c13) turns those paths red, so extend the pilot list only
# after the backfill for that crate lands.
