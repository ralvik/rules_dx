# Example checked-in Scalafix native config.
#
# Sole-policy example: without a checked-in `.scalafix.conf` the pinned tool
# uses upstream built-in defaults; with this file it interprets natively.
# OrganizeImports plus RemoveUnused are never auto-supplied by rules_dx.
rules = [
  OrganizeImports,
  RemoveUnused
]
