[package]
name = "dx_bump"
version = "0.0.0"
edition = "2021"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
toml_edit = "0.25"

[lib]
name = "dx_bump"
path = "src/lib.rs"
