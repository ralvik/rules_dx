# Shared per-cell coverage summary renderer for rules_dx CI jobs.
#
# Canonical single source for the per-cell rich summary block (issue #915,
# per-cell visibility contract issue #1062): previously each non-seed
# coverage job (arm64, musl-x86_64, musl-arm64, macos-arm64,
# windows-x86_64) repeated a near-identical thin echo block differing only
# by cell name plus log/rc filenames, with no coverage_bin verdict, no
# Uncovered locations, and no LCOV note, while only the seed cell published
# a PR comment. Jobs now call this one composite with `cell` plus `stem`
# plus `inventory`; every cell gates its own combined LCOV through the
# portable Rust `coverage_bin` against its versioned inventory and renders
# through the same `tools/coverage/coverage_comment.sh` script, so all six
# summaries share one shape (verdict plus Uncovered locations plus LCOV
# note plus dx rate line). The verdict lands in the step summary only,
# never merged across cells (no cross-cell union, no averaged percentages,
# no rounding up; Codecov stays opt-in only).
#
# Portability (issue #1062): `coverage_bin` is a portable `rust_binary`
# with no Linux-only label; the shell renderer stays a Bazel Linux-only
# `sh_binary` by the shell contract (seed runs on ubuntu-latest, so its
# `bazel run //tools/coverage:coverage_comment` path stays valid), while
# this composite invokes the same script directly via `bash
# tools/coverage/coverage_comment.sh`, which runs on every runner through
# `shell: bash` (linux plus macos plus windows-latest). Same script means
# byte-identical shape with no drift.
#
# PR visibility contract (issue #1062): only the seed cell publishes the
# integration-owned PR comment (one marker-owned comment, fork-safe); the
# five other cells stay step-summary only by design to avoid sixfold
# comment spam. Step summaries stay PR-visible; findings outside the diff
# stay in counts only with no invented locations.
#
# The seed cell keeps its own first-party block inline in ci.yml (same
# coverage_bin gate plus the same script via `bazel run`, plus the PR
# publish step); this composite covers the five non-seed cells with the
# same gate plus the same script via portable `bash`, step-summary only.
name: render-coverage-summary
description: Render the per-cell dx coverage verdict into the step summary.

inputs:
  cell:
    description: "Cell label, e.g. 'arm64 linux_arm64'."
    required: true
  stem:
    description: "Log/rc filename stem under RUNNER_TEMP, e.g. 'dx_coverage_arm64'."
    required: true
  inventory:
    description: "Versioned per-cell inventory, e.g. 'tools/coverage/arm64-inventory.txt'."
    required: true

runs:
  using: composite
  steps:
    - name: Render per-cell coverage summary
      shell: bash
      env:
        CELL: ${{ inputs.cell }}
        STEM: ${{ inputs.stem }}
        INVENTORY: ${{ inputs.inventory }}
      run: |
        set -euo pipefail
        tmp_dir="${RUNNER_TEMP:-/tmp}"
        log="$tmp_dir/$STEM.log"
        rc_file="$tmp_dir/$STEM.rc"
        dx_rc="$(cat "$rc_file" 2>/dev/null || echo unknown)"
        # Portable Rust gate plus the same shell renderer as the seed cell
        # (issue #1062): contain profraw spill, gate this runner's own
        # combined LCOV through coverage_bin against the per-cell inventory,
        # then present the verdict with coverage_comment.sh directly via
        # bash (same script the seed runs via Bazel; direct bash keeps
        # macos/windows portable despite the sh_binary Linux-only label).
        export LLVM_PROFILE_FILE="$tmp_dir/profraw_%m_%p.profraw"
        bazel build --noshow_progress //tools/coverage:coverage_bin >/dev/null 2>&1
        bazel coverage --noshow_progress //cli/lcov/... //tools/coverage/... //quality/evaluator/... \
          --combined_report=lcov \
          --instrumentation_filter='^//(cli/lcov|tools/coverage|quality/evaluator)' >/dev/null 2>&1 || true
        bazel query 'kind("source file", deps(//cli/lcov/... + //tools/coverage/... + //quality/evaluator/...))' 2>/dev/null \
          | grep -E '^//(cli/lcov|tools/coverage|quality/evaluator)[:/].*\.rs$' \
          | sed -e 's|^//||' -e 's|:|/|' \
          | LC_ALL=C sort -u > "$tmp_dir/${STEM}_sources.txt"
        set +e
        bazel run --noshow_progress //tools/coverage:coverage_bin -- --report bazel-out/_coverage/_coverage_report.dat \
          --inventory "$INVENTORY" --sources "$tmp_dir/${STEM}_sources.txt" --root . > "$tmp_dir/${STEM}_verdict.txt" 2>&1
        echo "$?" > "$tmp_dir/${STEM}_gate.rc"
        set -e
        cp "$log" "$tmp_dir/${STEM}_dx_out.txt" 2>/dev/null || true
        bash tools/coverage/coverage_comment.sh -- \
          --cell "$CELL" \
          --revision "${GITHUB_SHA}" \
          --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --out "$tmp_dir/${STEM}_comment.md" \
          --gate-output "$tmp_dir/${STEM}_verdict.txt" \
          --gate-exit "$(cat "$tmp_dir/${STEM}_gate.rc")" \
          --lcov bazel-out/_coverage/_coverage_report.dat \
          --dx-output "$tmp_dir/${STEM}_dx_out.txt" \
          --dx-exit "$dx_rc"
        cat "$tmp_dir/${STEM}_comment.md" >> "$GITHUB_STEP_SUMMARY"
        cat "$log" >> "$GITHUB_STEP_SUMMARY"
