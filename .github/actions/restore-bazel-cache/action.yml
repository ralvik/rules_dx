# Shared Bazel disk-cache restore for every rules_dx workflow job.
#
# Canonical source for the Bazel cache-key inputs (issue #953): the
# `hashFiles(...)` lock/config list lives once here. `ci.yml` passes only
# the per-host `prefix` (e.g. `bazel-seed-`), so a lock/config change means
# one edit here instead of N identical edits that could drift (previously
# repeated verbatim ~24x across ci.yml). Exact key only with no prefix
# fallback, so a bust starts cold; remote cache stays unwired (local-only
# execution, no remote cache/executor/BES flags). The key is branch-scoped
# via `github.ref` with no restore-keys fallback, so a poisoned PR entry is
# never reusable by main on the same lock hash (issue #1059). Saves run only
# on main via `lookup-only`, so PR runs are restore-only and main owns saves.
name: restore-bazel-cache
description: Restore the Bazel disk cache with the canonical exact-key inputs.

inputs:
  prefix:
    description: "Cache key prefix with trailing dash (e.g. bazel-seed-)."
    required: true

runs:
  using: composite
  steps:
    - name: Restore Bazel disk cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/bazel
        key: ${{ inputs.prefix }}${{ github.ref }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
        lookup-only: ${{ github.ref != 'refs/heads/main' }}
        # exact key only, bust starts cold; branch-scoped, restore-only off main
