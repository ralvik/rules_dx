# Shared checkout plus Bazelisk installer for every rules_dx workflow job.
#
# Canonical single source for the no-secrets checkout plus pinned Bazelisk
# setup (issue #915): previously each job repeated `actions/checkout@<sha>
# # v7` with `persist-credentials: false` plus
# `./.github/actions/setup-bazelisk` verbatim (~40x across ci.yml,
# reusable-consumer.yml, reusable-docs.yml, bump.yml, ghcr.yml), so a pin
# bump meant N identical edits that could drift. Jobs now call this one
# composite; the third-party checkout SHA pin plus the Bazelisk installer
# each live once (checkout here, installer in setup-bazelisk/action.yml).
#
# Relative `uses: ./.github/actions/setup-bazelisk` resolves against this
# repository (the called repo), so external consumer callers get the same
# pinned installer without copying it (same pattern as
# setup-bazelisk/action.yml).
name: setup-checkout-bazelisk
description: Check out the repository without credentials and install pinned Bazelisk.

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-bazelisk
