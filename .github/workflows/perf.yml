# Standing performance tracking (issue #215): Bazel-owned benchmarks with
# comparison machinery.
#
# Seed host: Linux x86_64 glibc (ubuntu-latest), local execution, no remote.
# Microbenchmarks run per-PR (fast, no Bazel query); scenario benchmarks
# (scope resolution, generate --check warm and cold) run on `main` pushes
# plus `workflow_dispatch` only (free-infra budget). Cold generate --check
# runs after `bazel shutdown` so server startup is measured.
#
# Comparison is median-of-N against perf/baseline.json with a tolerance
# band (relative + absolute floor against runner noise). Relative
# regressions post a warn-only PR comment and never fail; only the single
# gated absolute budget (dx_startup) fails the job. Baseline updates land
# via human-merged PRs only; no bot commits.
#
# Hygiene (issue #80): Bazelisk installs go through the single
# `.github/actions/setup-bazelisk` composite action; every third-party
# action is pinned to a commit SHA with its tag in a trailing comment.
# The Bazel disk cache uses actions/cache, which is free-tier eligible
# for public repositories.

name: perf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  micro:
    name: micro (per-PR benchmarks + docs freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-perf-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-perf-
            bazel-seed-
      - name: Build benchmark subjects
        run: bazel build --noshow_progress //cli/cli:dx //perf:bench_all //perf:compare //perf:perf_self_test
      - name: Prove comparison-machinery self-test
        run: bazel test --noshow_progress //perf:perf_self_test
      - name: Run microbenchmarks
        run: bazel run --noshow_progress //perf:bench_micro > /tmp/perf_micro.jsonl
      - name: Compare against baseline
        id: compare
        run: |
          # Warn-only regressions exit 0; only a gated absolute-budget
          # breach exits 1 and fails this step.
          # Absolute baseline path: `bazel run` starts in runfiles, so a
          # relative perf/baseline.json does not resolve (compare.py also
          # resolves relative baselines against BUILD_WORKSPACE_DIRECTORY).
          set +e
          bazel run --noshow_progress //perf:compare -- --baseline "$GITHUB_WORKSPACE/perf/baseline.json" --summary "$GITHUB_STEP_SUMMARY" /tmp/perf_micro.jsonl | tee /tmp/perf_compare.txt
          rc=${PIPESTATUS[0]}
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          grep -q "WARNING" /tmp/perf_compare.txt && echo "warned=true" >> "$GITHUB_OUTPUT" || echo "warned=false" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Post warn-only PR comment on regression
        if: github.event_name == 'pull_request' && steps.compare.outputs.warned == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Perf advisory (warn-only, never blocking)"
            echo ""
            echo '```'
            cat /tmp/perf_compare.txt
            echo '```'
            echo ""
            echo "Baseline: \`perf/baseline.json\`. Relative comparison stays advisory until months of stable signal."
          } > /tmp/perf_comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/perf_comment.md
      - name: Verify performance docs freshness
        run: |
          bazel run --noshow_progress //perf:regenerate
          git diff --exit-code -- docs/performance.md || {
            echo "docs/performance.md is stale: edit perf/baseline.json, run bazel run //perf:regenerate, and commit both." >&2
            exit 1
          }
      - name: Write job summary
        if: always()
        run: |
          echo "### perf micro — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran: bench_micro, compare vs baseline (warn-only), regenerate freshness." >> "$GITHUB_STEP_SUMMARY"
  scenario:
    name: scenario (scope + generate warm/cold, main and dispatch only)
    if: github.event_name != 'pull_request'
    needs: [micro]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-perf-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-perf-
            bazel-seed-
      - name: Build benchmark subjects
        run: bazel build --noshow_progress //cli/cli:dx //perf:bench_all //perf:compare
      - name: Run warm scenario benchmarks
        run: bazel run --noshow_progress //perf:bench_scenario_warm > /tmp/perf_scenario.jsonl
      - name: Run cold generate --check benchmark
        run: |
          bazel shutdown
          bazel run --noshow_progress //perf:bench_cold >> /tmp/perf_scenario.jsonl
      - name: Compare against baseline
        run: bazel run --noshow_progress //perf:compare -- --baseline "$GITHUB_WORKSPACE/perf/baseline.json" --summary "$GITHUB_STEP_SUMMARY" /tmp/perf_scenario.jsonl
      - name: Write job summary
        if: always()
        run: |
          echo "### perf scenario — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran: scope resolution, generate --check warm + cold vs baseline (warn-only)." >> "$GITHUB_STEP_SUMMARY"
