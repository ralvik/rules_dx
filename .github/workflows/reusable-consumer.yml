# Reusable consumer CI. This repository cuts no releases; the
# consumer-owned caller pins this file at a reviewed commit:
#   uses: rules_dx/.github/workflows/reusable-consumer.yml@<commit>
# Reviewed pin bumps only; no silent upgrades. Consumers never copy
# per-check execution, parsing, review, or comment-management logic.
#
# Contract: docs/github-ci.md. Nine checks: six Linux-once (lint,
# typecheck, format, generate, security-audit, license-audit) plus three
# per-platform (test, build, coverage). Starter enables all nine;
# callers disable individual checks by ID. Per-platform checks require
# an explicit nonempty platform list; there is no implicit default.
# Parallel is default; sequential changes overlap only. Aggregate `dx-ci`
# is the single stable required check. Reporting is first-party dx code;
# no reviewdog. SARIF Code Scanning publication is opt-in, off by default.
#
# Hygiene (issue #80): Bazelisk installs go through the single
# `.github/actions/setup-bazelisk` composite action; every third-party
# action is pinned to a commit SHA with its tag in a trailing comment.
# Platform labels never reach `runs-on` unchecked: `platforms-gate`
# fails closed on missing, empty, or unsupported selections before any
# per-platform job queues a runner.

name: rules-dx-consumer

on:
  workflow_call:
    inputs:
      rules_dx_version:
        description: "Pinned rules_dx version (e.g. 0.0.0). Must match the consumer MODULE.bazel pin."
        required: true
        type: string
      disabled_checks:
        description: "Comma-separated check IDs to omit (e.g. coverage,license-audit). Empty enables all nine."
        required: false
        default: ""
        type: string
      platforms:
        description: 'JSON array of platform labels for test/build/coverage (e.g. ["linux_x86_64"]). Required when any per-platform check is enabled; no implicit default.'
        required: false
        default: ""
        type: string
      scheduling_mode:
        description: "parallel (default) or sequential. Scheduling only; failure semantics unchanged."
        required: false
        default: "parallel"
        type: string
      code_scanning_opt_in:
        description: "Publish complete SARIF scans to Code Scanning. Off by default."
        required: false
        default: false
        type: boolean
      min_coverage:
        description: "Required line-coverage percent for the coverage check (e.g. 80). Empty collects without enforcing a threshold."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dx-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platforms-gate:
    name: platforms-gate (explicit supported platform selection)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: none
    steps:
      - name: Validate explicit platform selection
        env:
          PLATFORMS: ${{ inputs.platforms }}
          DISABLED: ${{ inputs.disabled_checks }}
          SCHEDULING: ${{ inputs.scheduling_mode }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          mode = os.environ.get("SCHEDULING", "parallel").strip() or "parallel"
          if mode == "sequential":
              print(
                  "dx-ci: scheduling_mode 'sequential' is qualification-open "
                  "(docs/github-ci.md#execution): the template schedules "
                  "parallel only until sequential ordering is qualified"
              )
              sys.exit(1)
          if mode != "parallel":
              print(f"dx-ci: unsupported scheduling_mode {mode!r}; want 'parallel'")
              sys.exit(1)
          disabled = ",".join(
              part.strip()
              for part in os.environ["DISABLED"].split(",")
              if part.strip()
          )
          padded = f",{disabled},"
          per_platform = [
              check
              for check in ("test", "build", "coverage")
              if f",{check}," not in padded
          ]
          if not per_platform:
              print("platforms-gate: no per-platform check enabled; nothing to validate")
              sys.exit(0)
          raw = os.environ["PLATFORMS"].strip()
          if not raw:
              print(
                  f"dx-ci: {', '.join(per_platform)} require explicit nonempty platforms; "
                  "no implicit default"
              )
              sys.exit(1)
          try:
              platforms = json.loads(raw)
          except json.JSONDecodeError:
              print(f"dx-ci: platforms is not a JSON array: {raw!r}")
              sys.exit(1)
          if not isinstance(platforms, list) or not platforms:
              print(f"dx-ci: platforms must be a nonempty JSON array, got: {raw!r}")
              sys.exit(1)
          supported = {"linux_x86_64", "linux_arm64", "macos_arm64"}
          bad = [p for p in platforms if p not in supported]
          if bad:
              print(
                  f"dx-ci: unsupported platforms {bad}; "
                  f"supported: {sorted(supported)}"
              )
              sys.exit(1)
          print(f"platforms-gate: {per_platform} on {platforms}")
          EOF

  lint:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',lint,') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: test -f MODULE.bazel && grep -F -q "version = \"$RULES_DX_PIN\"" MODULE.bazel
      - run: bazel run @rules_dx//cli/cli:dx -- lint --check //...

  typecheck:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',typecheck,') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - run: bazel run @rules_dx//cli/cli:dx -- typecheck --check //...

  format:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',format,') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - run: bazel run @rules_dx//cli/cli:dx -- format --check //...

  generate:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',generate,') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - run: bazel run @rules_dx//cli/cli:dx -- generate --check //...

  security-audit:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',security-audit,') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - run: bazel run @rules_dx//cli/cli:dx -- audit security //...

  license-audit:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',license-audit,') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - run: bazel run @rules_dx//cli/cli:dx -- audit license //...

  test:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',test,') }}
    needs: [platforms-gate]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ matrix.platform == 'linux_x86_64' && 'ubuntu-latest' || (matrix.platform == 'linux_arm64' && 'ubuntu-24.04-arm' || 'macos-14') }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require explicit platforms
        if: ${{ inputs.platforms == '' }}
        run: 'echo "dx-ci: test requires explicit nonempty platforms; no implicit default" >&2; exit 1'
      - uses: ./.github/actions/setup-bazelisk
      - run: bazel run @rules_dx//cli/cli:dx -- test //...

  build:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',build,') }}
    needs: [platforms-gate]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ matrix.platform == 'linux_x86_64' && 'ubuntu-latest' || (matrix.platform == 'linux_arm64' && 'ubuntu-24.04-arm' || 'macos-14') }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require explicit platforms
        if: ${{ inputs.platforms == '' }}
        run: 'echo "dx-ci: build requires explicit nonempty platforms; no implicit default" >&2; exit 1'
      - uses: ./.github/actions/setup-bazelisk
      - run: bazel run @rules_dx//cli/cli:dx -- build //...

  coverage:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',coverage,') }}
    needs: [platforms-gate]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ matrix.platform == 'linux_x86_64' && 'ubuntu-latest' || (matrix.platform == 'linux_arm64' && 'ubuntu-24.04-arm' || 'macos-14') }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require explicit platforms
        if: ${{ inputs.platforms == '' }}
        run: 'echo "dx-ci: coverage requires explicit nonempty platforms; no implicit default" >&2; exit 1'
      - uses: ./.github/actions/setup-bazelisk
      - name: Run coverage with optional threshold
        env:
          DX_MIN_COVERAGE: ${{ inputs.min_coverage }}
        run: |
          set +e
          extra=""
          if [ -n "$DX_MIN_COVERAGE" ]; then
            case "$DX_MIN_COVERAGE" in
              ''|*[!0-9.]*|*.*.*|.*|*.) echo "dx-ci: invalid min_coverage '$DX_MIN_COVERAGE': want e.g. 80 or 80.5" >&2; exit 1 ;;
            esac
            extra="--min-coverage $DX_MIN_COVERAGE"
          fi
          # Unquoted on purpose: empty stays zero words, a validated numeric
          # threshold stays one flag plus one value. Input travels via env and
          # is numeric-validated above, never interpolated into the script.
          # shellcheck disable=SC2086
          bazel run @rules_dx//cli/cli:dx -- coverage $extra //... 2>&1 | tee /tmp/dx_coverage.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/dx_coverage.rc
          exit $rc
      - name: Render first-party coverage summary (per-cell, no union)
        # First-party PR reporting (issue #254): same comment contract as
        # this repo's seed cell, per platform cell. Bazel-owned dx coverage
        # stays the gate; this step only presents its counts. No cross-cell
        # union, no averaged percentages, no rounding up. Findings stay in
        # counts only with no invented locations.
        if: always()
        run: |
          set -euo pipefail
          cell="coverage ${{ matrix.platform }}"
          dx_rc="$(cat /tmp/dx_coverage.rc 2>/dev/null || echo unknown)"
          dx_line="$(grep -E -e 'coverage .*lines.*meets minimum|coverage_below_minimum' /tmp/dx_coverage.log 2>/dev/null | head -n 1 || true)"
          if [[ "$dx_rc" == "0" ]]; then status="PASS"; else status="FAIL"; fi
          {
            echo "<!-- dx-coverage-summary: $cell -->"
            echo "## Coverage summary — $cell — $status"
            echo ""
            echo "Analyzed revision: \`${GITHUB_SHA}\` | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | Cell: \`$cell\`."
            echo ""
            if [[ -n "$dx_line" ]]; then echo "$dx_line"; echo ""; fi
            echo "Gate exit: $dx_rc (comment never changes this outcome)."
            echo ""
            echo "LCOV: Bazel-owned combined report for this cell (see workflow run ${GITHUB_RUN_ID})."
            echo ""
            echo "Scope: per-cell exact counts only; no cross-cell union, no averaged percentages, no rounding up. Codecov stays opt-in only, never required."
            echo ""
            echo "Findings outside the diff stay in counts only; no invented review locations."
          } > /tmp/coverage_comment.md
          cat /tmp/coverage_comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PR summary comment (dedup marker, fork-safe)
        # One updated comment per PR per cell marker; human comments never
        # touched; stale runs never overwrite current (concurrency cancels
        # superseded runs). Fork PRs skip so fork code never gets write
        # credentials. Publication failure fails separately while the gate
        # outcome above stays preserved.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          base_repo="${{ github.repository }}"
          if [[ "$head_repo" != "$base_repo" ]]; then
            echo "Fork PR detected: step-summary only, no PR comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="dx-coverage-summary: coverage ${{ matrix.platform }}"
          pr="${{ github.event.pull_request.number }}"
          existing="$(gh api "repos/$base_repo/issues/$pr/comments?per_page=100" --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | last // empty" || true)"
          if [[ -n "$existing" ]]; then
            jq -Rs '{body: .}' /tmp/coverage_comment.md > /tmp/coverage_payload.json
            gh api -X PATCH "repos/$base_repo/issues/comments/$existing" --input /tmp/coverage_payload.json --jq .id
          else
            gh pr comment "$pr" --body-file /tmp/coverage_comment.md
          fi

  dx-ci:
    name: dx-ci (aggregate)
    needs: [platforms-gate, lint, typecheck, format, generate, security-audit, license-audit, test, build, coverage]
    if: ${{ always() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Aggregate selected check results
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          results = {name: info.get("result") for name, info in needs.items()}
          print(json.dumps({"aggregate": "dx-ci", "needs": results}))
          # Disabled checks report skipped and stay green; every other
          # non-success (failure, cancelled) fails the aggregate so the
          # stable required check never hides a failing selection.
          bad = sorted(
              name for name, result in results.items()
              if result not in ("success", "skipped")
          )
          if bad:
              print(f"dx-ci: failing checks: {', '.join(bad)}")
              sys.exit(1)
          EOF
        env:
          NEEDS: ${{ toJSON(needs) }}
