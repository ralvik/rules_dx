# Sharded CI: build, test, coverage, prove, and dogfood stages run as
# separate jobs with per-job summaries (issue #210).
#
# Seed host: Linux x86_64 glibc (ubuntu-latest), local execution, no remote.
# Platform qualification stays open under issue #298: remaining ADR 0014
# required hosts are unqualified gaps with clean dx refusal, not claimed here.
#
# CI runs deterministic generation freshness through the
# canonical public path before the quality commands converge anything: a
# clean checkout must already be generator-stable.
#
# quality runs converge the corpus, check runs prove the deterministic no-op.
# The repository
# corpus (`real_source_target(name = "corpus_*")` per content type per package,
# issue #15, shared `tags = ["corpus"]`) plus the lane-A language trees
# (`//python/...`, `//javascript/...`, `//rust/hello/...`, issue #12) is the
# dogfood scope. CI installs no
# quality tools: Buildifier, Taplo, Vale, rustfmt, Ruff, Biome, and Clippy
# execute only as Bazel-resolved pinned actions (actions run with an empty
# PATH, unit-pinned in `quality_adapter::exec`). Corpus-local configs stay
# authoritative: aspect runs resolve Vale/Clippy policy solely from the
# `aspect_hints` bound by each corpus target, never from CI-local copies.
# Own-tree runs resolve workspace-level native policy (`//:ruff_config`,
# `//:biome_config`, `//:rustfmt_config`) through direct `aspect_hints`
# on normal targets (issue #12, lane A).
#
# Hygiene (issue #80): Bazelisk installs go through the single
# `.github/actions/setup-bazelisk` composite action; every third-party
# action is pinned to a commit SHA with its tag in a trailing comment.
# The Bazel disk cache uses actions/cache, which is free-tier eligible
# for public repositories, per the infrastructure budget in
# docs/testing/README.md. CI checkouts never contain `user.bazelrc`
# (gitignored local-only BCR mirror override), so every run resolves
# the canonical BCR registry plus MODULE.bazel.lock.
#
# Sharding policy (issue #210): one logical stage per job for failure
# attribution without log-grep forensics. All jobs stay on ubuntu-latest
# with the existing actions/cache disk cache (no new runners, no paid
# services). `needs:` chains enforce fast-fail ordering so a broken build
# skips downstream stages instead of burning parallel runners. Each job
# writes a `$GITHUB_STEP_SUMMARY` block so triage starts from the summary,
# not the raw log.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-ci:
    name: docs-ci (self-call reusable docs workflow)
    uses: ./.github/workflows/reusable-docs.yml
    with:
      rules_dx_version: "0.0.0"
      docs_scope: "//docs/..."
      docs_dir: "docs"
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
  consumer-ci:
    name: consumer-ci (self-call reusable consumer workflow)
    # Smoke test for the versioned consumer workflow: proves the reusable
    # file parses, the pin check passes, and the enabled checks execute
    # end-to-end on the working tree (local path: no version-pin
    # chicken-and-egg; rules_dx_version matches MODULE.bazel).
    # Only build is enabled: lint/typecheck/format/test/coverage over //...
    # fail on this repo's fixtures/testdata (#12), generate reports
    # pre-existing freshness drift (#15), and both audits fail closed
    # (#18). Re-enable each check here as its owner lands.
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      rules_dx_version: "0.0.0"
      platforms: '["linux_x86_64"]'
      disabled_checks: "lint,typecheck,format,generate,security-audit,license-audit,test,coverage"
    permissions:
      contents: read
      checks: write
      pull-requests: write
  build:
    name: build (bazel build //...)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Build workspace
        run: bazel build --noshow_progress //...
      - name: Write job summary
        if: always()
        run: |
          echo "### build — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel build //... (seed host, local-only)." >> "$GITHUB_STEP_SUMMARY"
  test:
    name: test (bazel test //...)
    needs: [build]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Test workspace
        run: bazel test --noshow_progress //...
      - name: Write job summary
        if: always()
        run: |
          echo "### test — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel test //... (seed host, local-only; manual targets excluded by Bazel tag semantics)." >> "$GITHUB_STEP_SUMMARY"
  coverage:
    name: coverage (dx coverage gate, seed cell)
    needs: [build]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Enforce seed coverage cell
        run: |
          set +e
          bazel run --noshow_progress //cli/cli:dx -- coverage --min-coverage 97 //... 2>&1 | tee /tmp/dx_coverage.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/dx_coverage.rc
          exit $rc
      - name: Render first-party coverage summary (seed cell, same LCOV)
        # First-party PR reporting (issue #254): Bazel-owned gate stays the
        # source of truth; this step only presents the verdict already
        # computed by the gate. Execution runs without secrets so fork code
        # never sees write credentials; publication below uses GH_TOKEN only
        # on non-fork PRs and never executes fork targets.
        if: always()
        run: |
          set -euo pipefail
          export LLVM_PROFILE_FILE="/tmp/profraw_%m_%p.profraw"
          bazel build --noshow_progress //tools/coverage:coverage_bin //tools/coverage:coverage_comment >/dev/null 2>&1
          bazel coverage --noshow_progress //cli/lcov/... //tools/coverage/... \
            --combined_report=lcov \
            --instrumentation_filter='^//(cli/lcov|tools/coverage)' >/dev/null 2>&1 || true
          bazel query 'kind("source file", deps(//cli/lcov/... + //tools/coverage/...))' 2>/dev/null \
            | grep -E '^//(cli/lcov|tools/coverage)[:/].*\.rs$' \
            | sed -e 's|^//||' -e 's|:|/|' \
            | LC_ALL=C sort -u > /tmp/seed_sources.txt
          set +e
          bazel-bin/tools/coverage/coverage_bin --report bazel-out/_coverage/_coverage_report.dat \
            --inventory tools/coverage/seed-inventory.txt --sources /tmp/seed_sources.txt --root . > /tmp/seed_verdict.txt 2>&1
          echo "$?" > /tmp/seed_gate.rc
          set -e
          dx_rc="$(cat /tmp/dx_coverage.rc 2>/dev/null || echo unknown)"
          cp /tmp/dx_coverage.log /tmp/dx_coverage_out.txt 2>/dev/null || true
          bazel run --noshow_progress //tools/coverage:coverage_comment -- \
            --cell "seed linux_x86_64" \
            --revision "${GITHUB_SHA}" \
            --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --out /tmp/coverage_comment.md \
            --gate-output /tmp/seed_verdict.txt \
            --gate-exit "$(cat /tmp/seed_gate.rc)" \
            --lcov bazel-out/_coverage/_coverage_report.dat \
            --dx-output /tmp/dx_coverage_out.txt \
            --dx-exit "$dx_rc"
          echo "### coverage summary (seed linux_x86_64, first-party, issue #254)" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage_comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PR summary comment (dedup marker, fork-safe)
        # One integration-owned updated comment per PR (docs/github-ci.md).
        # Dedup by marker; human comments never touched; concurrency group
        # cancels superseded runs so stale runs never overwrite current.
        # Fork PRs skip (step-summary only) so fork code never gets write
        # credentials. Publication failure fails this step separately while
        # the gate outcomes above stay preserved in the summary.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          base_repo="${{ github.repository }}"
          if [[ "$head_repo" != "$base_repo" ]]; then
            echo "Fork PR detected ($head_repo != $base_repo): step-summary only, no PR comment (fork code never gets write credentials)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="dx-coverage-summary: seed linux_x86_64"
          pr="${{ github.event.pull_request.number }}"
          existing="$(gh api "repos/$base_repo/issues/$pr/comments?per_page=100" --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | last // empty" || true)"
          if [[ -n "$existing" ]]; then
            jq -Rs '{body: .}' /tmp/coverage_comment.md > /tmp/coverage_payload.json
            gh api -X PATCH "repos/$base_repo/issues/comments/$existing" --input /tmp/coverage_payload.json --jq .id
            echo "Updated coverage summary comment $existing on PR #$pr." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr comment "$pr" --body-file /tmp/coverage_comment.md
            echo "Created coverage summary comment on PR #$pr." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prove coverage report contract (gate-owned LCOV, first-party comment)
        run: bazel run --noshow_progress //tools/ci:coverage_report_guards
      - name: Write job summary
        if: always()
        run: |
          echo "### coverage — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: dx coverage --min-coverage 97 //... (seed cell only; per-cell enforcement tracked in #89). First-party PR summary from the same seed LCOV (issue #254; Codecov at most opt-in)." >> "$GITHUB_STEP_SUMMARY"
  prove:
    name: prove (manual negatives, target tags, coverage cell, release hygiene, release policy, publish trust, shell contract)
    needs: [build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Prove manual negatives still fail as documented
        run: bazel run --noshow_progress //tools/ci:manual_negatives
      - name: Prove target-tag semantics
        run: bazel run --noshow_progress //tools/ci:target_tags
      - name: Prove seed coverage cell gate
        run: bazel run --noshow_progress //tools/ci:coverage_cell
      - name: Prove coverage spill containment (no profraw to checkout)
        run: bazel run --noshow_progress //tools/ci:coverage_spill
      - name: Prove release hygiene (no publication inputs without approval)
        run: bazel run --noshow_progress //tools/ci:release_hygiene
      - name: Prove release policy (curated defaults + parity manifest gate)
        run: bazel run --noshow_progress //tools/ci:release_policy
      - name: Prove publish trust (draft-only sites + nothing published)
        run: bazel run --noshow_progress //tools/ci:publish_trust
      - name: Prove shell contract (bash-only Linux-only harness + portable forms)
        run: bazel run --noshow_progress //tools/ci:shell_contract
      - name: Write job summary
        if: always()
        run: |
          echo "### prove — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Proved: manual negatives (manual-tag interaction), target-tag semantics, seed coverage cell gate, release hygiene (issue #5 no-publication inputs), release policy (issue #89 curated defaults + parity gate), publish trust (issues #78/#26/#5 draft-only sites + nothing published), shell contract (issue #299 bash-only Linux-only harness + portable forms)." >> "$GITHUB_STEP_SUMMARY"
          echo "Proved (follow-up): coverage spill containment (issues #252/#54, LLVM_PROFILE_FILE to scratch)." >> "$GITHUB_STEP_SUMMARY"
  e2e:
    name: e2e (Stage 4 CLI-contract suite, explicit invocation)
    needs: [build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Prove every scenario is wired (E2E-case convention, issue #54)
        run: bazel run --noshow_progress //tools/ci:e2e_cases
      - name: Run explicit E2E suite (manual drivers, never under //...)
        run: E2E_WORKSPACE=$GITHUB_WORKSPACE bazel test --noshow_progress //tools/ci:e2e --test_env=E2E_WORKSPACE
      - name: Write job summary
        if: always()
        run: |
          echo "### e2e — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: E2E_WORKSPACE=$GITHUB_WORKSPACE bazel test //tools/ci:e2e --test_env=E2E_WORKSPACE (explicit only; manual drivers skip //... under both bazel and dx, issue #55)." >> "$GITHUB_STEP_SUMMARY"
  dogfood-freshness:
    name: dogfood-freshness (tools, generate --check, corpus audit)
    needs: [build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-dogfood-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-dogfood-
            bazel-seed-
      - name: Prove Bazel-resolved quality tool execution
        run: |
          bazel build --noshow_progress @dx_tools//:buildifier @dx_tools//:taplo @dx_tools//:vale \
            //quality/evaluator:quality_evaluator
      - name: Verify generated-file freshness
        run: bazel run --noshow_progress //cli/cli:dx -- generate --check //...
      - name: Audit corpus ownership
        run: bazel run --noshow_progress //tools/ci:corpus_audit
      - name: Audit code ownership (normal targets, no silent skips)
        run: bazel run --noshow_progress //tools/ci:code_ownership
      - name: Audit examples READMEs (commands + evidence per foundation)
        run: bazel run --noshow_progress //tools/ci:examples_readme
      - name: Audit examples laziness (no-install + foundation isolation)
        run: bazel run --noshow_progress //tools/ci:examples_laziness
      - name: Audit examples laziness query (deps-closure zero-work)
        run: bazel run --noshow_progress //tools/ci:examples_laziness_query
      - name: Audit examples laziness aquery (action-graph zero-work)
        run: bazel run --noshow_progress //tools/ci:examples_laziness_aquery
      - name: Audit examples laziness runtime (action-command no-install)
        run: bazel run --noshow_progress //tools/ci:examples_laziness_runtime
      - name: Audit quality cache aquery (action-key isolation seed)
        run: bazel run --noshow_progress //tools/ci:quality_cache_aquery
      - name: Audit depcheck contract (truth table + open routes, no false claims)
        run: bazel run --noshow_progress //tools/ci:depcheck_contract
      - name: Audit execution guards (audit live + update live + exit maps)
        run: bazel run --noshow_progress //tools/ci:audit_update_guards
      - name: Audit wrapper sources (QualitySourcesInfo on all wrappers)
        run: bazel run --noshow_progress //tools/ci:wrapper_sources
      - name: Audit foundation maps (adapter boundaries + owner links)
        run: bazel run --noshow_progress //tools/ci:foundation_maps
      - name: Audit registry singularity (single-sourced class taxonomy)
        run: bazel run --noshow_progress //tools/ci:registry_singularity
      - name: Audit backlog contracts (env/codegen + docs-pipeline pins)
        run: bazel run --noshow_progress //tools/ci:backlog_contracts
      - name: Audit GHCR hygiene (separate workflow, gated push, pinned base)
        run: bazel run --noshow_progress //tools/ci:ghcr_hygiene
      - name: Audit publication guards (group triggers + gates + policy)
        run: bazel run --noshow_progress //tools/ci:ghcr_publish_guards
      - name: Audit verification foundations (perf pins + corpus rule + lane A)
        run: bazel run --noshow_progress //tools/ci:verify_perf_corpus
      - name: Audit widen-update loop contract (never-rewrites + manager set + bump command + runner, delivered)
        run: bazel run --noshow_progress //tools/ci:widen_update_loop
      - name: Audit quality foundations (provider + registry + mapping owners + battery contracts)
        run: bazel run --noshow_progress //tools/ci:quality_foundations_guards
      - name: Audit execution/corpus/perf guards (audit live + update live + corpus split + report-not-gate)
        run: bazel run --noshow_progress //tools/ci:execution_corpus_perf_guards
      - name: Audit distribution/closeout guards (hygiene + workflows + no-publish invariants)
        run: bazel run --noshow_progress //tools/ci:distribution_closeout_guards
      - name: Audit backlog/automation guards (contracts + examples + coverage/Renovate honesty)
        run: bazel run --noshow_progress //tools/ci:backlog_automation_guards
      - name: Audit Supported-evidence promotion gate (no Supported without platform+consumer+release)
        run: bazel run --noshow_progress //tools/ci:supported_evidence_gate
      - name: Write job summary
        if: always()
        run: |
          echo "### dogfood-freshness — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: Bazel-resolved tool execution, generate --check freshness, corpus ownership (carve-outs intact), code ownership (issue #12 lane A), examples READMEs (issue #85 commands + evidence), examples laziness (issue #85 no-install + isolation + deps-closure + action-graph + action-command zero-work), quality cache aquery (issue #84 action-key isolation seed), depcheck contract (issue #22 truth table + open routes), wrapper sources (issues #12/#7/#8 QualitySourcesInfo), registry singularity (issues #6/#84 single-sourced taxonomy), backlog contracts (issues #9/#10 frozen pins + gap labels), GHCR hygiene (issue #184 separate workflow + gated push), widen-update loop contract (issue #260 never-rewrites + manager set + bump command + runner, delivered), quality foundations (issues #6/#7/#8/#12 provider + registry + mapping owners + battery contracts), execution/corpus/perf guards (issues #18/#19/#22/#15/#86 audit live + update live + corpus split + report-not-gate), distribution/closeout guards (issues #5/#26/#78/#184/#54 hygiene + workflows + no-publish invariants), backlog/automation guards (issues #9/#10/#85/#254/#260 contracts + examples + coverage/Renovate honesty), Supported-evidence gate (issue #301 no Supported without platform+consumer+release).">> "$GITHUB_STEP_SUMMARY"
  dogfood-lint:
    name: dogfood-lint (dx lint converge + check)
    needs: [dogfood-freshness]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-dogfood-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-dogfood-
            bazel-seed-
      - name: Run dx lint over the corpus (default mode)
        run: |
          bazel query "attr(tags, corpus, kind(real_source_target, //...))" 2>/dev/null \
            | LC_ALL=C sort -u > /tmp/corpus_targets.txt
          scope="$(tr '\n' ' ' < /tmp/corpus_targets.txt)"
          bazel run --noshow_progress //cli/cli:dx -- lint $scope
      - name: Verify lint converged no-op in check mode
        run: |
          scope="$(tr '\n' ' ' < /tmp/corpus_targets.txt)"
          bazel run --noshow_progress //cli/cli:dx -- lint --check $scope
      - name: Verify lane-A language trees lint clean (enforcing, --fail-on warning)
        run: |
          bazel run --noshow_progress //cli/cli:dx -- lint --check //python/... //javascript/... //rust/hello/...
      - name: Write job summary
        if: always()
        run: |
          echo "### dogfood-lint — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran: dx lint over corpus (default converge) then lint --check no-op proof, plus lane-A language-tree lint --check (//python/... //javascript/... //rust/hello/..., enforcing at --fail-on warning, issue #12)." >> "$GITHUB_STEP_SUMMARY"
  dogfood-format:
    name: dogfood-format (dx format converge + check)
    needs: [dogfood-freshness]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-dogfood-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-dogfood-
            bazel-seed-
      - name: Run dx format over the corpus (default mode)
        run: |
          bazel query "attr(tags, corpus, kind(real_source_target, //...))" 2>/dev/null \
            | LC_ALL=C sort -u > /tmp/corpus_targets.txt
          scope="$(tr '\n' ' ' < /tmp/corpus_targets.txt)"
          bazel run --noshow_progress //cli/cli:dx -- format $scope
      - name: Verify format converged no-op in check mode
        run: |
          scope="$(tr '\n' ' ' < /tmp/corpus_targets.txt)"
          bazel run --noshow_progress //cli/cli:dx -- format --check $scope
      - name: Verify lane-A language trees format clean (enforcing, --fail-on warning)
        run: |
          bazel run --noshow_progress //cli/cli:dx -- format --check //python/... //javascript/... //rust/hello/...
      - name: Write job summary
        if: always()
        run: |
          echo "### dogfood-format — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran: dx format over corpus (default converge) then format --check no-op proof, plus lane-A language-tree format --check (//python/... //javascript/... //rust/hello/..., enforcing at --fail-on warning, issue #12)." >> "$GITHUB_STEP_SUMMARY"
  dogfood-typecheck:
    name: dogfood-typecheck (dx typecheck converge + check)
    needs: [dogfood-freshness]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-dogfood-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-dogfood-
            bazel-seed-
      - name: Run dx typecheck over the corpus (default mode)
        run: |
          bazel query "attr(tags, corpus, kind(real_source_target, //...))" 2>/dev/null \
            | LC_ALL=C sort -u > /tmp/corpus_targets.txt
          scope="$(tr '\n' ' ' < /tmp/corpus_targets.txt)"
          bazel run --noshow_progress //cli/cli:dx -- typecheck $scope
      - name: Verify typecheck converged no-op in check mode
        run: |
          scope="$(tr '\n' ' ' < /tmp/corpus_targets.txt)"
          bazel run --noshow_progress //cli/cli:dx -- typecheck --check $scope
      - name: Write job summary
        if: always()
        run: |
          echo "### dogfood-typecheck — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran: dx typecheck over corpus (default converge) then typecheck --check no-op proof." >> "$GITHUB_STEP_SUMMARY"
  devcontainer-check:
    name: devcontainer-check (init parity, definition valid)
    needs: [build]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-dogfood-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-dogfood-
            bazel-seed-
      - name: Prove dx init scaffold matches checked-in definition
        run: bazel test --noshow_progress //.devcontainer:devcontainer_parity_test
      - name: Validate devcontainer definition shape
        run: |
          python3 - <<'EOF'
          import json
          with open(".devcontainer/devcontainer.json") as handle:
              definition = json.load(handle)
          post_create = definition["postCreateCommand"]
          assert "bazel run //dx:env" in post_create, post_create
          assert "bazel build //..." not in post_create, post_create
          print("devcontainer definition valid:", post_create)
          EOF
      - name: Write job summary
        if: always()
        run: |
          echo "### devcontainer-check — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: dx init scaffold parity plus devcontainer definition shape (check-only; container boot stays an open gap per docs/contributing/devcontainer.md)." >> "$GITHUB_STEP_SUMMARY"
