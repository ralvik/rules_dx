# Sharded CI: build, test, coverage, prove, and dogfood stages run as
# separate jobs with per-job summaries (issue #210).
#
# Host matrix (issue #415, after portable-shell #323): per-host jobs
# parameterized by runner plus cache scope plus qualified-host expectation.
# Qualified hosts: Linux x86_64 glibc (ubuntu-latest) plus Linux arm64
# glibc native (ubuntu-24.04-arm, issue #410) plus Linux static-musl
# profiles (issue #411, cross-built from Linux runners with per-profile
# cache scopes) plus macOS arm64 native (macos-14, issue #412) plus macOS
# x86_64 best-effort native (macos-15-intel, issue #413, non-blocking;
# `macos-13` retired December 2025, `macos-15-intel` until August 2027) plus
# Windows x86_64 MSVC-compatible native (windows-latest with shell bash,
# issue #414), local execution, no remote.
# Platform qualification for the remaining ADR 0014 host stays open under
# issue #298 (closed; per-host successors own each host): out-of-v1 Windows
# arm64 is the unqualified gap with clean dx refusal, not claimed here.
#
# CI runs deterministic generation freshness through the
# canonical public path before the quality commands converge anything: a
# clean checkout must already be generator-stable.
#
# Dogfood invokes the same entrypoints plus scope as the consumer
# (issue #408): `dx <check> --check //...` verbatim, no corpus-query or
# converge. The repository `//...` scope is the dogfood scope (fixtures
# and testdata ride the same checks as production code; target-coupled
# tsc delegates to the upstream build plus test, ty resolves via staged
# deps). CI installs no
# quality tools: Buildifier, Taplo, Vale, rustfmt, Ruff, Biome, and Clippy
# execute only as Bazel-resolved pinned actions (actions run with an empty
# PATH, unit-pinned in `quality_adapter::exec`). Corpus-local configs stay
# authoritative: aspect runs resolve Vale/Clippy policy solely from the
# `aspect_hints` bound by each corpus target, never from CI-local copies.
# Own-tree runs resolve workspace-level native policy (`//:ruff_config`,
# `//:biome_config`, `//:rustfmt_config`) through direct `aspect_hints`
# on normal targets (issue #12, lane A).
#
# Hygiene (issue #80): Bazelisk installs go through the single
# `.github/actions/setup-bazelisk` composite action; every third-party
# action is pinned to a commit SHA with its tag in a trailing comment.
# The Bazel disk cache uses actions/cache, which is free-tier eligible
# for public repositories, per the infrastructure budget in
# docs/testing/README.md. CI checkouts never contain `user.bazelrc`
# (gitignored local-only BCR mirror override), so every run resolves
# the canonical BCR registry plus MODULE.bazel.lock.
#
# Sharding policy (issue #210): one logical stage per job for failure
# attribution without log-grep forensics. Seed jobs stay on ubuntu-latest
# with the `bazel-seed-` disk-cache scope; Linux arm64 native jobs
# (issue #410) stay on ubuntu-24.04-arm with the separate `bazel-arm64-`
# scope; static-musl profile jobs (issue #411) cross-build from Linux
# runners with per-profile `bazel-musl-x86_64-` plus `bazel-musl-arm64-`
# scopes; macOS arm64 native jobs (issue #412) stay on macos-14 with the
# separate `bazel-macos-arm64-` scope; macOS x86_64 best-effort native jobs
# (issue #413) stay on macos-15-intel with the separate
# `bazel-macos-x86_64-` scope; Windows x86_64 MSVC-compatible native jobs
# (issue #414) stay on windows-latest with shell bash and the separate
# `bazel-windows-x86_64-` scope (free-tier eligible, no paid services;
# best-effort gaps never block required-host release). `needs:` chains
# enforce
# fast-fail ordering so a broken build skips downstream stages instead of
# burning parallel runners. Each job writes a `$GITHUB_STEP_SUMMARY` block
# so triage starts from the summary, not the raw log.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-ci:
    name: docs-ci (self-call reusable docs workflow)
    uses: ./.github/workflows/reusable-docs.yml
    with:
      rules_dx_version: "0.0.0"
      docs_scope: "//docs/..."
      docs_dir: "docs"
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
  consumer-ci:
    name: consumer-ci (self-call reusable consumer workflow)
    # Dogfood-like consumer (issue #408): proves the reusable file parses,
    # the pin check passes, and all nine checks execute end-to-end on the
    # working tree (local path: no version-pin chicken-and-egg;
    # rules_dx_version matches MODULE.bazel). All checks enabled with
    # verbatim `//...` scope, same entrypoints as external consumers.
    # Runs on all qualified hosts (seed plus arm64 native plus macOS arm64
    # plus macOS x86_64 best-effort plus Windows x86_64 MSVC-compatible,
    # issues #410/#412/#413/#414).
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      rules_dx_version: "0.0.0"
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "macos_x86_64", "windows_x86_64"]'
      disabled_checks: ""
    permissions:
      contents: read
      checks: write
      pull-requests: write
  build:
    name: build (bazel build //...)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Build workspace
        run: bazel build --noshow_progress //...
      - name: Adopt-rust dx_dev smoke (local_path_override + dx_dev wiring, issue #407)
        run: bazel build --noshow_progress //examples/adopt-rust/... --config=dx_dev
      - name: Write job summary
        if: always()
        run: |
          echo "### build — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel build //... plus adopt-rust dx_dev smoke (seed host, local-only; hermetic CLI-contract, issue #407)." >> "$GITHUB_STEP_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
  preset-stale:
    name: preset-stale (dx update --check, Linux once)
    # Consumer-CI stale cell (issue #332): Linux-once preset freshness
    # gate. Review-required with no auto-merge per issue #332
    # (`dx_ci::preset_bot_auto_merge_allowed()==false`,
    # `preset_regen_requires_review()==true`): a stale fragment fails
    # here and must be fixed by a reviewed `dx update` plus flag-diff.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Check preset freshness
        run: |
          bazel run --noshow_progress //tools/bazelrc:preset.update -- --verify-only
          bazel run --noshow_progress //cli/cli:dx -- update --check
      - name: Write job summary
        if: always()
        run: |
          echo "### preset-stale — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: bazel run //tools/bazelrc:preset.update -- --verify-only; bazel run //cli/cli:dx -- update --check (Linux once, review-required, no auto-merge)." >> "$GITHUB_STEP_SUMMARY"
  test:
    name: test (bazel test //...)
    needs: [build]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Test workspace
        run: bazel test --noshow_progress //...
      - name: Write job summary
        if: always()
        run: |
          echo "### test — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel test //... (seed host, local-only; manual targets excluded by Bazel tag semantics)." >> "$GITHUB_STEP_SUMMARY"
  coverage:
    name: coverage (dx coverage gate, seed cell)
    needs: [build]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-seed-
      - name: Enforce seed coverage cell
        run: |
          set +e
          bazel run --noshow_progress //cli/cli:dx -- coverage --min-coverage 97 //... 2>&1 | tee /tmp/dx_coverage.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/dx_coverage.rc
          exit $rc
      - name: Render first-party coverage summary (seed cell, same LCOV)
        # First-party PR reporting (issue #254): Bazel-owned gate stays the
        # source of truth; this step only presents the verdict already
        # computed by the gate. Execution runs without secrets so fork code
        # never sees write credentials; publication below uses GH_TOKEN only
        # on non-fork PRs and never executes fork targets.
        if: always()
        run: |
          set -euo pipefail
          export LLVM_PROFILE_FILE="/tmp/profraw_%m_%p.profraw"
          bazel build --noshow_progress //tools/coverage:coverage_bin //tools/coverage:coverage_comment >/dev/null 2>&1
          bazel coverage --noshow_progress //cli/lcov/... //tools/coverage/... \
            --combined_report=lcov \
            --instrumentation_filter='^//(cli/lcov|tools/coverage)' >/dev/null 2>&1 || true
          bazel query 'kind("source file", deps(//cli/lcov/... + //tools/coverage/...))' 2>/dev/null \
            | grep -E '^//(cli/lcov|tools/coverage)[:/].*\.rs$' \
            | sed -e 's|^//||' -e 's|:|/|' \
            | LC_ALL=C sort -u > /tmp/seed_sources.txt
          set +e
          bazel-bin/tools/coverage/coverage_bin --report bazel-out/_coverage/_coverage_report.dat \
            --inventory tools/coverage/seed-inventory.txt --sources /tmp/seed_sources.txt --root . > /tmp/seed_verdict.txt 2>&1
          echo "$?" > /tmp/seed_gate.rc
          set -e
          dx_rc="$(cat /tmp/dx_coverage.rc 2>/dev/null || echo unknown)"
          cp /tmp/dx_coverage.log /tmp/dx_coverage_out.txt 2>/dev/null || true
          bazel run --noshow_progress //tools/coverage:coverage_comment -- \
            --cell "seed linux_x86_64" \
            --revision "${GITHUB_SHA}" \
            --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --out /tmp/coverage_comment.md \
            --gate-output /tmp/seed_verdict.txt \
            --gate-exit "$(cat /tmp/seed_gate.rc)" \
            --lcov bazel-out/_coverage/_coverage_report.dat \
            --dx-output /tmp/dx_coverage_out.txt \
            --dx-exit "$dx_rc"
          echo "### coverage summary (seed linux_x86_64, first-party, issue #254)" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/coverage_comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PR summary comment (dedup marker, fork-safe)
        # One integration-owned updated comment per PR (docs/github-ci.md).
        # Dedup by marker; human comments never touched; concurrency group
        # cancels superseded runs so stale runs never overwrite current.
        # Fork PRs skip (step-summary only) so fork code never gets write
        # credentials. Publication failure fails this step separately while
        # the gate outcomes above stay preserved in the summary.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          base_repo="${{ github.repository }}"
          if [[ "$head_repo" != "$base_repo" ]]; then
            echo "Fork PR detected ($head_repo != $base_repo): step-summary only, no PR comment (fork code never gets write credentials)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="dx-coverage-summary: seed linux_x86_64"
          pr="${{ github.event.pull_request.number }}"
          existing="$(gh api "repos/$base_repo/issues/$pr/comments?per_page=100" --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | last // empty" || true)"
          if [[ -n "$existing" ]]; then
            jq -Rs '{body: .}' /tmp/coverage_comment.md > /tmp/coverage_payload.json
            gh api -X PATCH "repos/$base_repo/issues/comments/$existing" --input /tmp/coverage_payload.json --jq .id
            echo "Updated coverage summary comment $existing on PR #$pr." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr comment "$pr" --body-file /tmp/coverage_comment.md
            echo "Created coverage summary comment on PR #$pr." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prove coverage report contract (gate-owned LCOV, first-party comment)
        run: bazel run --noshow_progress //tools/ci:coverage_report_guards
      - name: Write job summary
        if: always()
        run: |
          echo "### coverage — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: dx coverage --min-coverage 97 //... (seed cell only; per-cell enforcement tracked in #89). First-party PR summary from the same seed LCOV (issue #254; Codecov at most opt-in)." >> "$GITHUB_STEP_SUMMARY"
  build-arm64:
    name: build-arm64 (bazel build //..., linux arm64 native)
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-arm64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-arm64-
      - name: Build workspace
        run: bazel build --noshow_progress //...
      - name: Adopt-rust dx_dev smoke (local_path_override + dx_dev wiring, issue #407)
        run: bazel build --noshow_progress //examples/adopt-rust/... --config=dx_dev
      - name: Write job summary
        if: always()
        run: |
          echo "### build-arm64 — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel build //... plus adopt-rust dx_dev smoke (linux arm64 native, local-only; issue #410)." >> "$GITHUB_STEP_SUMMARY"
  test-arm64:
    name: test-arm64 (bazel test //..., linux arm64 native)
    needs: [build-arm64]
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-arm64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-arm64-
      - name: Test workspace
        run: bazel test --noshow_progress //...
      - name: Write job summary
        if: always()
        run: |
          echo "### test-arm64 — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel test //... (linux arm64 native, local-only; manual targets excluded by Bazel tag semantics; issue #410)." >> "$GITHUB_STEP_SUMMARY"
  coverage-arm64:
    name: coverage-arm64 (dx coverage gate, arm64 cell)
    needs: [build-arm64]
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-arm64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-arm64-
      - name: Enforce arm64 coverage cell
        run: |
          set +e
          bazel run --noshow_progress //cli/cli:dx -- coverage --min-coverage 97 //... 2>&1 | tee /tmp/dx_coverage_arm64.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/dx_coverage_arm64.rc
          exit $rc
      - name: Render arm64 per-cell summary (same scope, no union)
        # Per-cell evidence without a cross-cell union (issue #410): the
        # arm64 runner gates its own combined LCOV through the arm64 cell
        # inventory; the verdict lands in the step summary only, never
        # merged with the seed cell. Codecov stays opt-in only.
        if: always()
        run: |
          set -euo pipefail
          dx_rc="$(cat /tmp/dx_coverage_arm64.rc 2>/dev/null || echo unknown)"
          dx_line="$(grep -E -e 'coverage .*lines.*meets minimum|coverage_below_minimum' /tmp/dx_coverage_arm64.log 2>/dev/null | head -n 1 || true)"
          if [[ "$dx_rc" == "0" ]]; then status="PASS"; else status="FAIL"; fi
          {
            echo "<!-- dx-coverage-summary: arm64 linux_arm64 -->"
            echo "## Coverage summary — arm64 linux_arm64 — $status"
            echo ""
            echo "Analyzed revision: \`${GITHUB_SHA}\` | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | Cell: \`arm64 linux_arm64\`."
            echo ""
            if [[ -n "$dx_line" ]]; then echo "$dx_line"; echo ""; fi
            echo "Gate exit: $dx_rc (summary never changes this outcome)."
            echo ""
            echo "Scope: per-cell exact counts only; no cross-cell union, no averaged percentages, no rounding up. Codecov stays opt-in only, never required."
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/dx_coverage_arm64.log >> "$GITHUB_STEP_SUMMARY"
      - name: Write job summary
        if: always()
        run: |
          echo "### coverage-arm64 — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: dx coverage --min-coverage 97 //... (arm64 cell only, per-cell no-union; issue #410)." >> "$GITHUB_STEP_SUMMARY"
  build-musl-x86_64:
    name: build-musl-x86_64 (static musl closure, linux x86_64)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-musl-x86_64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-musl-x86_64-
      - name: Prove Rust static-musl std resolves
        run: bazel query @rust_toolchains//... 2>/dev/null | grep -E -e 'musl' | LC_ALL=C sort -u
      - name: Build workspace (exec-platform tools)
        run: bazel build --noshow_progress //...
      - name: Write job summary
        if: always()
        run: |
          echo "### build-musl-x86_64 — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel query musl toolchains plus bazel build //... (linux x86_64 static musl closure, local-only; exec-platform tools for build scripts/proc macros, target musl libs for apps; dynamic musl explicitly out of scope; issue #411)." >> "$GITHUB_STEP_SUMMARY"
  build-musl-arm64:
    name: build-musl-arm64 (static musl closure, linux arm64)
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-musl-arm64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-musl-arm64-
      - name: Prove Rust static-musl std resolves
        run: bazel query @rust_toolchains//... 2>/dev/null | grep -E -e 'musl' | LC_ALL=C sort -u
      - name: Build workspace (exec-platform tools)
        run: bazel build --noshow_progress //...
      - name: Write job summary
        if: always()
        run: |
          echo "### build-musl-arm64 — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel query musl toolchains plus bazel build //... (linux arm64 static musl closure, local-only; exec-platform tools for build scripts/proc macros, target musl libs for apps; dynamic musl explicitly out of scope; issue #411)." >> "$GITHUB_STEP_SUMMARY"
  coverage-musl-x86_64:
    name: coverage-musl-x86_64 (dx coverage gate, musl x86_64 cell)
    needs: [build-musl-x86_64]
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-musl-x86_64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-musl-x86_64-
      - name: Enforce musl x86_64 coverage cell
        run: |
          set +e
          bazel run --noshow_progress //cli/cli:dx -- coverage --min-coverage 97 //... 2>&1 | tee /tmp/dx_coverage_musl_x86.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/dx_coverage_musl_x86.rc
          exit $rc
      - name: Render musl x86_64 per-cell summary (same scope, no union)
        # Per-cell evidence without a cross-cell union (issue #411): the
        # musl runner gates its own combined LCOV through the musl x86_64
        # cell inventory; the verdict lands in the step summary only, never
        # merged with other cells. Codecov stays opt-in only. Dynamic musl
        # has no cell and stays explicitly out of scope.
        if: always()
        run: |
          set -euo pipefail
          dx_rc="$(cat /tmp/dx_coverage_musl_x86.rc 2>/dev/null || echo unknown)"
