        if: always()
        run: |
          echo "### coverage-musl-x86_64 — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: dx coverage --min-coverage 97 //... (musl x86_64 cell only, per-cell no-union; static musl only, dynamic out of scope; issue #411)." >> "$GITHUB_STEP_SUMMARY"
