  devcontainer-check:
    name: devcontainer-check (init parity, definition valid)
    needs: [build]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-checkout-bazelisk
      - name: Restore Bazel disk cache
        uses: ./.github/actions/restore-bazel-cache
        with:
          prefix: bazel-dogfood-
