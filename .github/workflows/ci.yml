    # //deploy/release:sbom_demo plus verifies via
    # //deploy/release:dx_release_tools_test on every push/PR, stages
    # SPDX-2.3 + SLSA v1 under RUNNER_TEMP, and uploads as a per-host CI
    # artifact for inspection. Pinned acquired SDK with the hermetic-llvm
    # Apple-SDK backend provisional and no host-installed SDK fallback.
    # Real Sigstore plus GitHub attestation stays owner-gated human-run
    # via //deploy/release:signing_demo (fork-safe: CI never signs PR
