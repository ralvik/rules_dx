        # musl runner gates its own combined LCOV through the musl x86_64
        # cell inventory; the verdict lands in the step summary only, never
        # merged with other cells. Codecov stays opt-in only. Dynamic musl
        # has no cell and stays explicitly out of scope.
        if: always()
        run: |
          set -euo pipefail
          dx_rc="$(cat ${RUNNER_TEMP:-/tmp}/dx_coverage_musl_x86.rc 2>/dev/null || echo unknown)"
          dx_line="$(grep -E -e 'coverage .*lines.*meets minimum|coverage_below_minimum' ${RUNNER_TEMP:-/tmp}/dx_coverage_musl_x86.log 2>/dev/null | head -n 1 || true)"
          if [[ "$dx_rc" == "0" ]]; then status="PASS"; else status="FAIL"; fi
          {
            echo "<!-- dx-coverage-summary: musl-x86_64 linux_x86_64_musl -->"
            echo "## Coverage summary — musl-x86_64 linux_x86_64_musl — $status"
            echo ""
            echo "Analyzed revision: \`${GITHUB_SHA}\` | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | Cell: \`musl-x86_64 linux_x86_64_musl\`."
            echo ""
            if [[ -n "$dx_line" ]]; then echo "$dx_line"; echo ""; fi
            echo "Gate exit: $dx_rc (summary never changes this outcome)."
            echo ""
            echo "Scope: per-cell exact counts only; no cross-cell union, no averaged percentages, no rounding up. Codecov stays opt-in only, never required."
          } >> "$GITHUB_STEP_SUMMARY"
          cat ${RUNNER_TEMP:-/tmp}/dx_coverage_musl_x86.log >> "$GITHUB_STEP_SUMMARY"
