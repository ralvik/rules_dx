# CI policy notes live in `.github/workflows/README.md` (split from header comments, no behavior change).

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI flag set (the workspace `.bazelrc` `ci` plus `ci-pr` configs) and
  # the optional BuildBuddy key, passed inline on every Bazel and dx call.
  # No key (fork pull request, or a caller that passes no secret): both
  # stay empty, so no remote-cache flag is set at all and Bazel runs
  # local-cache only. With a key, pull requests stay read-only via
  # `ci-pr` and the header rides inline (never in a committed rc file).
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && '--remote_header=x-buildbuddy-api-key=' + secrets.BUILDBUDDY_API_KEY || '' }}
  # Preserve Bazel labels (`//...`) passed through Git Bash to native
  # Windows binaries, while still converting MSYS paths (`/c/...` to
  # `C:\...`) that tools like tsc.bat require. Excluding only the `//`
  # prefix (not `*`, not `MSYS_NO_PATHCONV`) keeps both working.
  MSYS2_ARG_CONV_EXCL: "//"
  # Single-sourced Bazelisk pin for every setup-bazel step in this
  # workflow (tracked against .devcontainer/Dockerfile.prebuilt by
  # //tools/ci:pin_consistency_test).
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dogfood:
    name: dogfood (self-call reusable consumer workflow)
    # Dogfood-like consumer (issue #408, Phase 1 issue #607): proves the
    # reusable file parses, the pin check passes, and the checks execute
    # end-to-end on the working tree (local path: no version-pin
    # chicken-and-egg; rules_dx_version matches MODULE.bazel). This is the
    # single per-platform stack: `dx build`, `dx test`, and `dx coverage`
    # (min 97) run on all four qualified hosts, fully parallel with every
    # other job (no per-cell raw duplicate build/test/coverage jobs; each
    # cell compiles once and executes its tests under `dx test` plus
    # `dx coverage`). Verbatim `//...` scope, same entrypoints as external
    # consumers. Runs on all qualified hosts (seed plus arm64 native plus
    # macOS arm64 plus Windows x86_64
    # MSVC-compatible, issues #410/#412/#414).
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      rules_dx_version: "0.0.0"
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "windows_x86_64"]'
      min_coverage: "97"
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
  dogfood-freshness:
    name: dogfood-freshness (tools, generate --check, corpus audit)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Check preset freshness (issue #332)
        run: |
          bazel run --noshow_progress $BAZEL_CONFIG $BB_ARGS //tools/bazelrc:preset_update -- --verify-only
          bazel run $BAZEL_CONFIG $BB_ARGS --noshow_progress //cli/cli:dx -- update --check -- $BAZEL_CONFIG $BB_ARGS
      - name: Adopt-rust dx_dev smoke (local_path_override + dx_dev wiring, issue #407)
        run: bazel build --noshow_progress //examples/adopt-rust/... --config=dx_dev $BAZEL_CONFIG $BB_ARGS
      - name: Prove battery (target tags, coverage, platforms, release, shell)
        # Includes //tools/ci:shell_contract via tools/ci/prove.sh.
        run: tools/ci/prove.sh
      - name: Prove coverage report contract (gate-owned LCOV, first-party comment)
        run: bazel run --noshow_progress //tools/ci:coverage_report_guards $BAZEL_CONFIG $BB_ARGS
      - name: Report skip volume (Linux-only sh harness, issue #769)
        if: always()
        run: |
          echo "### skip volume — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cell seed linux_x86_64 real run, 0 skips: all 58 sh_test executed, no Linux-only skip (budget pinned by bazel run //tools/ci:skip_budget_qualification, issue #769)." >> "$GITHUB_STEP_SUMMARY"
          echo "Cell linux_arm64 real run, 0 skips: all 58 sh_test executed, no Linux-only skip (budget pinned by bazel run //tools/ci:skip_budget_qualification, issue #769)." >> "$GITHUB_STEP_SUMMARY"
          echo "Cell macos_arm64 budgeted 58 sh_test skips honestly (181 sh_binary build skips, 240 Linux-only labels; budget pinned by bazel run //tools/ci:skip_budget_qualification, issue #769)." >> "$GITHUB_STEP_SUMMARY"
          echo "Cell windows x86_64 budgeted 58 sh_test skips honestly (181 sh_binary build skips, 240 Linux-only labels; budget pinned by bazel run //tools/ci:skip_budget_qualification, issue #769)." >> "$GITHUB_STEP_SUMMARY"
      - name: Run dogfood-freshness battery (tools, freshness, audits)
        run: bazel run --noshow_progress //tools/ci:dogfood_freshness $BAZEL_CONFIG $BB_ARGS
      - name: Write job summary
        if: always()
        run: |
          echo "### dogfood-freshness — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: preset freshness (dx update --check, issue #332), adopt-rust dx_dev smoke (issue #407), prove battery (target tags, coverage cell/spill/qualification, platforms, release hygiene/policy, publish trust, shell contract, bootstrap, flakiness via tools/ci/prove.sh), coverage report guards, skip-volume inventory (issue #769), then the dogfood-freshness guard battery (Bazel-resolved tool execution, generate --check freshness, corpus/code ownership, non-dogfed plan, examples checks, closeout/distribution/backlog/docs/consumer guards; full inventory in tools/ci/dogfood_freshness.sh)." >> "$GITHUB_STEP_SUMMARY"
  devcontainer-check:
    name: devcontainer-check (init parity, definition valid)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Prove dx init scaffold matches checked-in definition
        run: bazel test --noshow_progress --flaky_test_attempts=3 --test_timeout=300 //.devcontainer:devcontainer_parity_test $BAZEL_CONFIG $BB_ARGS
      - name: Validate devcontainer definition shape
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'EOF'
          import json
          with open(".devcontainer/devcontainer.json") as handle:
              definition = json.load(handle)
          post_create = definition["postCreateCommand"]
          assert "bazel run //dx:env" in post_create, post_create
          assert "bazel build //..." not in post_create, post_create
          print("devcontainer definition valid:", post_create)
          EOF
      - name: Write job summary
        if: always()
        run: |
          echo "### devcontainer-check — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: dx init scaffold parity plus devcontainer definition shape (check-only; seed-host boot manually verified on Dockerfile change with non-Linux/arm64 wont-fix, no boot job in CI per docs/contributing/devcontainer.md#container-boot-manual)." >> "$GITHUB_STEP_SUMMARY"
  ci:
    name: ci
    # Single required status check for branch protection: aggregates every
    # job in this workflow so one green gate covers the whole matrix.
    # `if: always()` keeps the gate reporting when a need is cancelled or
    # fails; skipped needs count as non-failing.
    if: ${{ always() }}
    needs:
      [
        dogfood,
        dogfood-freshness,
        devcontainer-check,
      ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'EOF'
          import json
          import os
          import sys

          needs = json.loads(os.environ.get("NEEDS") or "{}")
          failing = sorted(
              key
              for key, value in needs.items()
              if value.get("result") not in ("success", "skipped")
          )
          print(json.dumps({"aggregate": "ci", "failing checks": failing}))
          sys.exit(1 if failing else 0)
          EOF
      - name: Write job summary
        if: always()
        run: |
          echo "### ci — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Aggregate required check over every ci.yml job (branch-protection single gate; skipped needs are non-failing)." >> "$GITHUB_STEP_SUMMARY"
# BEGIN qualification check strings — must be present for tools/ci/ci_matrix_qualification.sh
# Host matrix (issue #415): Linux x86_64 glibc (ubuntu-latest with shell bash); Linux arm64 glibc (ubuntu-24.04-arm, issue #410); macOS arm64 (macos-latest with shell bash, issue #412); macOS x86_64 Not planned per #976 with no jobs; Windows x86_64 MSVC-compatible native (windows-latest with shell bash, Platform-qualified under issue #414; WSL/MSYS out of scope for bootstrap per issue #298 (closed; per-host successors own each host)).
# This workflow keeps no per-cell raw build/coverage jobs; every host runs inside .github/workflows/reusable-consumer.yml (consumer self-call, full dx test plus dx coverage, no disabled checks).
# END qualification check strings
