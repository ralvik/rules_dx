# Minimal CI skeleton: build, test, and implementation-coverage gate on
# the seed host only.
#
# Seed host: Linux x86_64 glibc (ubuntu-latest), local execution, no remote.
# Full host coverage and CI qualification stay open; unavailable required
# hosts from ADR 0014 are recorded as gaps, not claimed here.
#
# CI runs deterministic generation freshness through the
# canonical public path before the quality commands converge anything: a
# clean checkout must already be generator-stable.
#
# quality runs converge the corpus, check runs prove the deterministic no-op.
# The repository
# corpus (`real_source_target(name = "corpus")` per package) is the dogfood
# scope. CI installs no
# quality tools: Buildifier, Taplo, Vale, rustfmt, and Clippy execute only
# as Bazel-resolved pinned actions (actions run with an empty PATH,
# unit-pinned in `quality_adapter::exec`). Corpus-local configs stay authoritative: aspect
# runs resolve Vale/Clippy policy solely from the `aspect_hints` bound by
# each corpus target, never from CI-local copies.

name: ci

on:
  push:
  pull_request:

jobs:
  docs-ci:
    name: docs-ci (self-call reusable docs workflow)
    uses: ./.github/workflows/reusable-docs.yml
    with:
      rules_dx_version: "0.0.0"
      docs_scope: "//docs/..."
      docs_dir: "docs"
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
  build-test:
    name: build-test (Linux x86_64 glibc, local-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Bazelisk
        run: |
          curl -sL -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  /tmp/bazelisk" | sha256sum -c -
          sudo install -m755 /tmp/bazelisk /usr/local/bin/bazel
          bazel version
      - run: bazel build //...
      - run: bazel test //...
      - run: bazel run //rust/hello:hello
      - run: bazel coverage //...
      - name: Enforce implementation-coverage gate
        run: |
          bazel query 'kind("source file", deps(//...))' 2>/dev/null \
            | grep '^//' | sed 's|^//||; s|:|/|' | grep -E '\.(rs|go)$' | sort > /tmp/implementation_sources.txt
          bazel run //tools/coverage:check -- \
            --report "$GITHUB_WORKSPACE/bazel-out/_coverage/_coverage_report.dat" \
            --inventory "$GITHUB_WORKSPACE/tools/coverage/inventory.txt" \
            --sources /tmp/implementation_sources.txt \
            --root "$GITHUB_WORKSPACE"
  corpus-dogfood:
    name: corpus-dogfood (dx quality commands, Linux x86_64 glibc, local-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Bazelisk
        run: |
          curl -sL -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  /tmp/bazelisk" | sha256sum -c -
          sudo install -m755 /tmp/bazelisk /usr/local/bin/bazel
          bazel version
      - name: Prove Bazel-resolved quality tool execution
        run: |
          bazel build @dx_tools//:buildifier @dx_tools//:taplo @dx_tools//:vale \
            //quality/evaluator:quality_evaluator
      - name: Verify generated-file freshness
        run: bazel run //dx:generate_check
      - name: Audit corpus ownership
        run: |
          # The paket2bazel hub output below is generator-owned (regenerate via
          # `bazel run @rules_dotnet//tools/paket2bazel`, see
          # third_party/dotnet/deps/BUILD.bazel), never corpus sources. The
          # marker check keeps this exclusion honest: hand edits lose it.
          head -1 third_party/dotnet/deps/paket.main.bzl | grep -q GENERATED
          head -1 third_party/dotnet/deps/paket.main_extension.bzl | grep -qi GENERATED
          git ls-files \
            | grep -E '(^|/)(BUILD\.bazel|MODULE\.bazel)$|\.(bzl|toml|md)$' \
            | grep -v -E '\.lock$' \
            | grep -v -E '^third_party/dotnet/deps/paket\.main(_extension)?\.bzl$' \
            | LC_ALL=C sort -u > /tmp/corpus_applicable.txt
          bazel query "kind('source file', deps(kind(real_source_target, //...)))" 2>/dev/null \
            | grep -E '^(@@)?//' \
            | sed 's/^@@//; s|^//||; s|:|/|; s|^/||' \
            | LC_ALL=C sort -u > /tmp/corpus_closure.txt
          uncovered="$(comm -23 /tmp/corpus_applicable.txt /tmp/corpus_closure.txt | wc -l | tr -d ' ')"
          if [ "$uncovered" -ne 0 ]; then
            echo "corpus ownership audit failed: $uncovered applicable files have no corpus owner:"
            comm -23 /tmp/corpus_applicable.txt /tmp/corpus_closure.txt
            exit 1
          fi
      - name: Run dx quality commands over the corpus (default mode)
        run: |
          bazel query "attr(name, '^corpus\$', kind(real_source_target, //...))" 2>/dev/null \
            | LC_ALL=C sort -u > /tmp/corpus_targets.txt
          scope="$(tr '\n' ' ' < /tmp/corpus_targets.txt)"
          bazel run //dx/cli:dx -- lint $scope
          bazel run //dx/cli:dx -- format $scope
          bazel run //dx/cli:dx -- typecheck $scope
      - name: Verify converged no-op in check mode
        run: |
          scope="$(tr '\n' ' ' < /tmp/corpus_targets.txt)"
          bazel run //dx/cli:dx -- lint --check $scope
          bazel run //dx/cli:dx -- format --check $scope
          bazel run //dx/cli:dx -- typecheck --check $scope
