# CI policy notes live in `.github/workflows/README.md` (split from header comments, no behavior change).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-ci:
    name: docs-ci (self-call reusable docs workflow)
    uses: ./.github/workflows/reusable-docs.yml
    with:
      rules_dx_version: "0.0.0"
      docs_scope: "//docs/..."
      docs_dir: "docs"
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
  dogfood:
    name: dogfood (self-call reusable consumer workflow)
    # Dogfood-like consumer (issue #408, Phase 1 issue #607): proves the
    # reusable file parses, the pin check passes, and eight checks execute
    # end-to-end on the working tree (local path: no version-pin
    # chicken-and-egg; rules_dx_version matches MODULE.bazel). `test`
    # stays disabled: `dx coverage` resolves scope via `resolve_for_test`
    # (same as `dx test`, `cli/cli/src/exec/workflow.rs`) and runs `bazel
    # coverage`, which executes the tests, so running both doubles test
    # execution. Verbatim `//...` scope, same entrypoints as external
    # consumers. Runs on all qualified hosts (seed plus arm64 native plus
    # macOS arm64 plus macOS x86_64 best-effort plus Windows x86_64
    # MSVC-compatible, issues #410/#412/#413/#414).
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      rules_dx_version: "0.0.0"
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "macos_x86_64", "windows_x86_64"]'
      disabled_checks: "test"
    permissions:
      contents: read
      checks: write
      pull-requests: write
  build:
    name: build (bazel build //...)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
          # exact key only, bust starts cold
      - name: Build workspace
        run: bazel build --noshow_progress //...
      - name: Adopt-rust dx_dev smoke (local_path_override + dx_dev wiring, issue #407)
        run: bazel build --noshow_progress //examples/adopt-rust/... --config=dx_dev
      - name: Write job summary
        if: always()
        run: |
          echo "### build — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel build //... plus adopt-rust dx_dev smoke (seed host, local-only; hermetic CLI-contract, issue #407)." >> "$GITHUB_STEP_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
  sbom:
    name: sbom (SBOM + provenance build/verify/upload, seed host)
    # SBOM plus provenance on CI (issue #612): sbom_demo only ran on
    # workflow_dispatch dry-run, never built or verified on push, with no
    # attestation. This job builds //deploy/release:sbom_demo plus verifies
    # via //deploy/release:dx_release_tools_test on every push/PR (seed host),
    # stages SPDX-2.3 + SLSA v1 under RUNNER_TEMP, and uploads as a CI
    # artifact for inspection. Real Sigstore plus GitHub attestation stays
    # owner-gated human-run via //deploy/release:signing_demo (fork-safe:
    # CI never signs PR code, publishes nothing).
    needs: [build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
          # exact key only, bust starts cold
      - name: Build SBOM + provenance demo
        run: bazel build --noshow_progress //deploy/release:sbom_demo
      - name: Verify SBOM + provenance bind artifact
        run: bazel test --noshow_progress --flaky_test_attempts=3 --test_timeout=300 //deploy/release:dx_release_tools_test
      - name: Stage SBOM + provenance for upload
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/sbom"
          rm -rf "$stage"
          mkdir -p "$stage"
          spdx="$(bazel cquery --output=files //deploy/release:sbom_demo_spdx)"
          prov="$(bazel cquery --output=files //deploy/release:sbom_demo_provenance)"
          cp "$spdx" "$stage/sbom_demo.spdx.json"
          cp "$prov" "$stage/sbom_demo.provenance.json"
          grep -q -F '"spdxVersion": "SPDX-2.3"' "$stage/sbom_demo.spdx.json"
          grep -q -F '"predicateType": "https://slsa.dev/provenance/v1"' "$stage/sbom_demo.provenance.json"
          grep -q -F '"_type": "https://in-toto.io/Statement/v1"' "$stage/sbom_demo.provenance.json"
          python3 - "$stage" <<'EOF'
          import hashlib
          import pathlib
          import sys
          stage = pathlib.Path(sys.argv[1])
          lines = []
          for name in ("sbom_demo.spdx.json", "sbom_demo.provenance.json"):
              digest = hashlib.sha256((stage / name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}\n")
              print(f"{name}: {digest}")
          (stage / "digests.txt").write_text("".join(lines), encoding="utf-8")
          EOF
          cat "$stage/digests.txt"
      - name: Upload SBOM + provenance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-provenance
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 7
      - name: Write job summary
        if: always()
        run: |
          echo "### sbom — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: bazel build //deploy/release:sbom_demo; bazel test //deploy/release:dx_release_tools_test; stage SPDX-2.3 + SLSA v1 under RUNNER_TEMP/sbom and upload as sbom-provenance (seed host, publishes nothing; attestation stays owner-gated human-run via //deploy/release:signing_demo, issue #612)." >> "$GITHUB_STEP_SUMMARY"
  preset-stale:
    name: preset-stale (dx update --check, Linux once)
    # Consumer-CI stale cell (issue #332): Linux-once preset freshness
    # gate. Review-required with no auto-merge per issue #332
    # (`dx_ci::preset_bot_auto_merge_allowed()==false`,
    # `preset_regen_requires_review()==true`): a stale fragment fails
    # here and must be fixed by a reviewed `dx update` plus flag-diff.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
          # exact key only, bust starts cold
      - name: Check preset freshness
        run: |
          bazel run --noshow_progress //tools/bazelrc:preset.update -- --verify-only
          bazel run --noshow_progress //cli/cli:dx -- update --check
      - name: Write job summary
        if: always()
        run: |
          echo "### preset-stale — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: bazel run //tools/bazelrc:preset.update -- --verify-only; bazel run //cli/cli:dx -- update --check (Linux once, review-required, no auto-merge)." >> "$GITHUB_STEP_SUMMARY"
  test:
    name: test (bazel test //...)
    needs: [build]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
          # exact key only, bust starts cold
      - name: Test workspace
        run: bazel test --noshow_progress --flaky_test_attempts=3 --test_timeout=300 //...
      - name: Report skip volume (Linux-only sh harness, issue #769)
        if: always()
        run: |
          echo "### skip volume — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cell seed linux_x86_64 real run, 0 skips: all 31 sh_test executed, no Linux-only skip (budget pinned by bazel run //tools/ci:skip_budget_qualification, issue #769)." >> "$GITHUB_STEP_SUMMARY"
      - name: Write job summary
        if: always()
        run: |
          echo "### test — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel test //... (seed host, local-only; manual targets excluded by Bazel tag semantics)." >> "$GITHUB_STEP_SUMMARY"
  coverage:
    name: coverage (dx coverage gate, seed cell)
    needs: [build]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-seed-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
          # exact key only, bust starts cold
      - name: Enforce seed coverage cell
        run: |
          set +e
          bazel run --noshow_progress //cli/cli:dx -- coverage --min-coverage 97 //... 2>&1 | tee ${RUNNER_TEMP:-/tmp}/dx_coverage.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > ${RUNNER_TEMP:-/tmp}/dx_coverage.rc
          exit $rc
      - name: Render first-party coverage summary (seed cell, same LCOV)
        # First-party PR reporting (issue #254): Bazel-owned gate stays the
        # source of truth; this step only presents the verdict already
        # computed by the gate. Execution runs without secrets so fork code
        # never sees write credentials; publication below uses GH_TOKEN only
        # on non-fork PRs and never executes fork targets.
        if: always()
        run: |
          set -euo pipefail
          export LLVM_PROFILE_FILE="${RUNNER_TEMP:-/tmp}/profraw_%m_%p.profraw"
          bazel build --noshow_progress //tools/coverage:coverage_bin //tools/coverage:coverage_comment >/dev/null 2>&1
          bazel coverage --noshow_progress //cli/lcov/... //tools/coverage/... \
            --combined_report=lcov \
            --instrumentation_filter='^//(cli/lcov|tools/coverage)' >/dev/null 2>&1 || true
          bazel query 'kind("source file", deps(//cli/lcov/... + //tools/coverage/...))' 2>/dev/null \
            | grep -E '^//(cli/lcov|tools/coverage)[:/].*\.rs$' \
            | sed -e 's|^//||' -e 's|:|/|' \
            | LC_ALL=C sort -u > ${RUNNER_TEMP:-/tmp}/seed_sources.txt
          set +e
          bazel-bin/tools/coverage/coverage_bin --report bazel-out/_coverage/_coverage_report.dat \
            --inventory tools/coverage/seed-inventory.txt --sources ${RUNNER_TEMP:-/tmp}/seed_sources.txt --root . > ${RUNNER_TEMP:-/tmp}/seed_verdict.txt 2>&1
          echo "$?" > ${RUNNER_TEMP:-/tmp}/seed_gate.rc
          set -e
          dx_rc="$(cat ${RUNNER_TEMP:-/tmp}/dx_coverage.rc 2>/dev/null || echo unknown)"
          cp ${RUNNER_TEMP:-/tmp}/dx_coverage.log ${RUNNER_TEMP:-/tmp}/dx_coverage_out.txt 2>/dev/null || true
          bazel run --noshow_progress //tools/coverage:coverage_comment -- \
            --cell "seed linux_x86_64" \
            --revision "${GITHUB_SHA}" \
            --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --out ${RUNNER_TEMP:-/tmp}/coverage_comment.md \
            --gate-output ${RUNNER_TEMP:-/tmp}/seed_verdict.txt \
            --gate-exit "$(cat ${RUNNER_TEMP:-/tmp}/seed_gate.rc)" \
            --lcov bazel-out/_coverage/_coverage_report.dat \
            --dx-output ${RUNNER_TEMP:-/tmp}/dx_coverage_out.txt \
            --dx-exit "$dx_rc"
          echo "### coverage summary (seed linux_x86_64, first-party, issue #254)" >> "$GITHUB_STEP_SUMMARY"
          cat ${RUNNER_TEMP:-/tmp}/coverage_comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PR summary comment (dedup marker, fork-safe)
        # One integration-owned updated comment per PR (docs/github-ci.md).
        # Dedup by marker; human comments never touched; concurrency group
        # cancels superseded runs so stale runs never overwrite current.
        # Fork PRs skip (step-summary only) so fork code never gets write
        # credentials. Publication failure fails this step separately while
        # the gate outcomes above stay preserved in the summary.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          base_repo="${{ github.repository }}"
          if [[ "$head_repo" != "$base_repo" ]]; then
            echo "Fork PR detected ($head_repo != $base_repo): step-summary only, no PR comment (fork code never gets write credentials)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="dx-coverage-summary: seed linux_x86_64"
          pr="${{ github.event.pull_request.number }}"
          existing="$(gh api "repos/$base_repo/issues/$pr/comments?per_page=100" --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | last // empty" || true)"
          if [[ -n "$existing" ]]; then
            jq -Rs '{body: .}' ${RUNNER_TEMP:-/tmp}/coverage_comment.md > ${RUNNER_TEMP:-/tmp}/coverage_payload.json
            gh api -X PATCH "repos/$base_repo/issues/comments/$existing" --input ${RUNNER_TEMP:-/tmp}/coverage_payload.json --jq .id
            echo "Updated coverage summary comment $existing on PR #$pr." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr comment "$pr" --body-file ${RUNNER_TEMP:-/tmp}/coverage_comment.md
            echo "Created coverage summary comment on PR #$pr." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prove coverage report contract (gate-owned LCOV, first-party comment)
        run: bazel run --noshow_progress //tools/ci:coverage_report_guards
      - name: Write job summary
        if: always()
        run: |
          echo "### coverage — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: dx coverage --min-coverage 97 //... (seed cell only; per-cell enforcement tracked in #89). First-party PR summary from the same seed LCOV (issue #254; Codecov at most opt-in)." >> "$GITHUB_STEP_SUMMARY"
  build-arm64:
    name: build-arm64 (bazel build //..., linux arm64 native)
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-arm64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
          # exact key only, bust starts cold
      - name: Build workspace
        run: bazel build --noshow_progress //...
      - name: Adopt-rust dx_dev smoke (local_path_override + dx_dev wiring, issue #407)
        run: bazel build --noshow_progress //examples/adopt-rust/... --config=dx_dev
      - name: Write job summary
        if: always()
        run: |
          echo "### build-arm64 — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel build //... plus adopt-rust dx_dev smoke (linux arm64 native, local-only; issue #410)." >> "$GITHUB_STEP_SUMMARY"
  test-arm64:
    name: test-arm64 (bazel test //..., linux arm64 native)
    needs: [build-arm64]
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-arm64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
          # exact key only, bust starts cold
      - name: Test workspace
        run: bazel test --noshow_progress --flaky_test_attempts=3 --test_timeout=300 //...
      - name: Report skip volume (Linux-only sh harness, issue #769)
        if: always()
        run: |
          echo "### skip volume — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Cell linux_arm64 real run, 0 skips: all 31 sh_test executed, no Linux-only skip (budget pinned by bazel run //tools/ci:skip_budget_qualification, issue #769)." >> "$GITHUB_STEP_SUMMARY"
      - name: Write job summary
        if: always()
        run: |
          echo "### test-arm64 — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: bazel test //... (linux arm64 native, local-only; manual targets excluded by Bazel tag semantics; issue #410)." >> "$GITHUB_STEP_SUMMARY"
  coverage-arm64:
    name: coverage-arm64 (dx coverage gate, arm64 cell)
    needs: [build-arm64]
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Restore Bazel disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/bazel
          key: bazel-arm64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'tools/bazelrc/preset.bazelrc', '.bazelversion', '.npmrc', 'cargo-bazel-lock.json', '**/Cargo.lock', '**/Cargo.toml', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/maven_install.json', '**/go.mod', '**/go.sum', '**/paket.dependencies', '**/paket.lock', '**/uv.lock', '**/pyproject.toml') }}
          # exact key only, bust starts cold
      - name: Enforce arm64 coverage cell
        run: |
          set +e
          bazel run --noshow_progress //cli/cli:dx -- coverage --min-coverage 97 //... 2>&1 | tee ${RUNNER_TEMP:-/tmp}/dx_coverage_arm64.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > ${RUNNER_TEMP:-/tmp}/dx_coverage_arm64.rc
          exit $rc
      - name: Render arm64 per-cell summary (same scope, no union)
        # Per-cell evidence without a cross-cell union (issue #410): the
        # arm64 runner gates its own combined LCOV through the arm64 cell
        # inventory; the verdict lands in the step summary only, never
        # merged with the seed cell. Codecov stays opt-in only.
        if: always()
        run: |
          set -euo pipefail
          dx_rc="$(cat ${RUNNER_TEMP:-/tmp}/dx_coverage_arm64.rc 2>/dev/null || echo unknown)"
          dx_line="$(grep -E -e 'coverage .*lines.*meets minimum|coverage_below_minimum' ${RUNNER_TEMP:-/tmp}/dx_coverage_arm64.log 2>/dev/null | head -n 1 || true)"
          if [[ "$dx_rc" == "0" ]]; then status="PASS"; else status="FAIL"; fi
          {
            echo "<!-- dx-coverage-summary: arm64 linux_arm64 -->"
            echo "## Coverage summary — arm64 linux_arm64 — $status"
            echo ""
            echo "Analyzed revision: \`${GITHUB_SHA}\` | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | Cell: \`arm64 linux_arm64\`."
            echo ""
            if [[ -n "$dx_line" ]]; then echo "$dx_line"; echo ""; fi
            echo "Gate exit: $dx_rc (summary never changes this outcome)."
            echo ""
            echo "Scope: per-cell exact counts only; no cross-cell union, no averaged percentages, no rounding up. Codecov stays opt-in only, never required."
          } >> "$GITHUB_STEP_SUMMARY"
          cat ${RUNNER_TEMP:-/tmp}/dx_coverage_arm64.log >> "$GITHUB_STEP_SUMMARY"
      - name: Write job summary
        if: always()
        run: |
