          grep -q -F '"_type": "https://in-toto.io/Statement/v1"' "$stage/sbom_demo.provenance.json"
          python3 - "$stage" <<'EOF'
          import hashlib
          import pathlib
          import sys
          stage = pathlib.Path(sys.argv[1])
          lines = []
          for name in ("sbom_demo.spdx.json", "sbom_demo.provenance.json"):
              digest = hashlib.sha256((stage / name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}\n")
              print(f"{name}: {digest}")
          (stage / "digests.txt").write_text("".join(lines), encoding="utf-8")
          EOF
          cat "$stage/digests.txt"
      - name: Upload SBOM + provenance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-provenance-windows_x86_64
          path: ${{ runner.temp }}/sbom-windows-x86_64
