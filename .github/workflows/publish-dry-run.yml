# Publishing dry-run (issues #78, #311): exercise the release path without
# cutting a release. `workflow_dispatch` only: no push, pull_request, tag,
# or schedule trigger, so CI stays green by construction and nothing runs
# uninvited.
#
# Seed-host first: builds the Linux x86_64 `dx` binary plus the seed
# `dx_standalone` archive, records sha256 digests, generates SBOM and
# provenance via //deploy/release:sbom_demo, exercises the draft-only
# publisher in dry-run mode (GH_RELEASE_DRY_RUN=1, always with draft-only
# flags), exercises owner-gated signing in dry-run mode
# (RELEASE_SIGN_DRY_RUN=1), checks the Bazel Central Registry module shape
# via //deploy/release:bcr_demo without submitting, and proves the install
# verifier refuses checksum-only inputs on the Sigstore TUF trust root.
# Emits a dry-run report to the step summary and logs. The full release
# matrix is frozen in deploy/release/matrix.bzl (seed qualified, four
# follow-ups unqualified per issue #311 as hosts qualify); SBOM,
# signing/attestation, and BCR run owner-gated dry-run-first per the
# human-run release path (docs/deploy/release-runbook.md, issue #458); GHCR images
# stay in the separate ghcr.yml workflow per owner decision. Nothing here
# tags, publishes, or pushes, with or without approval: `dist/`/`release/`
# stay git-ignored, staging happens under RUNNER_TEMP so the checkout is
# never left dirty, and the default run only reports what *would* publish.
#
# Hygiene (issue #80): Bazelisk installs go through the single
# `.github/actions/setup-bazelisk` composite action; the only third-party
# action (checkout) is pinned to a commit SHA with its tag trailing.

name: publish-dry-run

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Owner approval to run the full dry-run qualification. False builds and reports only; nothing publishes either way."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazelisk
      - name: Build seed-host release binary and standalone archive
        run: bazel build //cli/cli:dx //cli/cli:dx_standalone //deploy/release:all
      - name: Stage binary and emit dry-run report
        env:
          APPROVE: ${{ inputs.approve }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/publish-dry-run"
          rm -rf "$stage"
          mkdir -p "$stage"
          bin="$(bazel cquery --output=files //cli/cli:dx)"
          cp "$bin" "$stage/dx-linux-x86_64"
          (cd "$stage" && sha256sum dx-linux-x86_64 > dx-linux-x86_64.sha256)
          archive="$(bazel cquery --output=files //cli/cli:dx_standalone_archive)"
          checksum="$(bazel cquery --output=files //cli/cli:dx_standalone_checksum)"
          cp "$archive" "$stage/dx-standalone.tar.gz"
          cp "$checksum" "$stage/dx-standalone.tar.gz.sha256"
          GH_RELEASE_DRY_RUN=1 bazel run //cli/cli:github_draft > "$stage/draft-dry-run.log" 2>&1
          grep -q "v0.0.0-dryrun" "$stage/draft-dry-run.log"
          grep -q -- "--draft --verify-tag" "$stage/draft-dry-run.log"
          bazel test //deploy/release:all --noshow_progress > "$stage/release-tests.log" 2>&1
          grep -q "8 tests pass" "$stage/release-tests.log"
          RELEASE_SIGN_DRY_RUN=1 bazel run //deploy/release:signing_demo > "$stage/signing-dry-run.log" 2>&1
          grep -q "tuf-repo-cdn.sigstore.dev" "$stage/signing-dry-run.log"
          grep -q "cosign sign-blob" "$stage/signing-dry-run.log"
          BCR_DRY_RUN=1 bazel run //deploy/release:bcr_demo > "$stage/bcr-dry-run.log" 2>&1
          grep -q "would submit, submitting nothing" "$stage/bcr-dry-run.log"
          ./deploy/release/release.sh v0.0.0-dryrun > "$stage/human-run-dry-run.log" 2>&1
          grep -q "dry run (RELEASE_DRY_RUN=1)" "$stage/human-run-dry-run.log"
          {
            echo "Bazel Central Registry module shape (checked, not submitted):"
            grep -F 'name = "rules_dx"' MODULE.bazel
            grep -F 'version = "0.0.0"' MODULE.bazel
          } > "$stage/bcr-shape.txt"
          {
            echo "install verifier refusal proof (no network, publishes nothing):"
            ./deploy/install/dx_verify.sh --help > "$stage/verify-help.txt"
            grep -q "tuf-repo-cdn.sigstore.dev" deploy/install/dx_verify.sh
            if ./deploy/install/dx_verify.sh --binary "$stage/dx-linux-x86_64" --sha256 deadbeef > "$stage/verify-refusal.log" 2>&1; then
              echo "expected checksum-only refusal failed" >&2
              exit 1
            fi
            grep -q "checksum-only verification is not publisher-identity proof" "$stage/verify-refusal.log"
          }
          python3 - "$stage" "$APPROVE" <<'EOF'
          import hashlib
          import json
          import sys
          stage, approve = sys.argv[1], sys.argv[2] == "true"
          digest = hashlib.sha256(open(f"{stage}/dx-linux-x86_64", "rb").read()).hexdigest()
          standalone_digest = hashlib.sha256(open(f"{stage}/dx-standalone.tar.gz", "rb").read()).hexdigest()
          draft_log = open(f"{stage}/draft-dry-run.log", encoding="utf-8").read()
          draft_ok = "v0.0.0-dryrun" in draft_log and "--draft --verify-tag" in draft_log
          signing_log = open(f"{stage}/signing-dry-run.log", encoding="utf-8").read()
          signing_ok = "cosign sign-blob" in signing_log and "tuf-repo-cdn.sigstore.dev" in signing_log
          bcr_log = open(f"{stage}/bcr-dry-run.log", encoding="utf-8").read()
          bcr_ok = "would submit, submitting nothing" in bcr_log
          report = {
              "schema": "publish-dry-run/v1",
              "approved": approve,
              "published": False,
              "artifacts": [
                  {
                      "name": "dx-linux-x86_64",
                      "sha256": digest,
                      "note": "seed-host binary; release matrix frozen in deploy/release/matrix.bzl",
                  },
                  {
                      "name": "dx-standalone.tar.gz",
                      "sha256": standalone_digest,
                      "note": "seed-host standalone archive via //cli/cli:dx_standalone; wider matrix unqualified per issue #311",
                  },
              ],
              "release_matrix": [
                  {"name": "dx-linux-x86_64", "status": "qualified-seed-built-here"},
                  {"name": "dx-linux-arm64", "status": "unqualified-per-issue-311"},
                  {"name": "dx-macos-x86_64", "status": "unqualified-per-issue-311"},
                  {"name": "dx-macos-arm64", "status": "unqualified-per-issue-311"},
                  {"name": "dx-windows-x86_64", "status": "unqualified-per-issue-311"},
              ],
              "exercised": [
                  "seed binary build //cli/cli:dx with sha256 staged under RUNNER_TEMP",
                  "seed standalone archive //cli/cli:dx_standalone with sha256 staged under RUNNER_TEMP",
                  "SBOM/provenance generation //deploy/release:sbom_demo (SPDX-2.3 + SLSA v1, owner-gated, publishes nothing)",
                  "draft-only publisher //cli/cli:github_draft in GH_RELEASE_DRY_RUN=1 mode (placeholder v0.0.0-dryrun, draft-only flags, publishes nothing)",
                  "owner-gated signing //deploy/release:signing_demo in RELEASE_SIGN_DRY_RUN=1 mode (Sigstore keyless + attestation, publishes nothing)",
                  "Bazel Central Registry shape via //deploy/release:bcr_demo in BCR_DRY_RUN=1 mode (rules_dx at 0.0.0, checked not submitted)",
                  "human-run driver deploy/release/release.sh dry run (owner approval + tag ceiling, publishes nothing)",
                  "install verifier //deploy/install:dx_verify refusal proof (checksum-only rejected, TUF trust root, fails before install)",
              ],
              "draft_dry_run": {
                  "target": "//cli/cli:github_draft",
                  "mode": "GH_RELEASE_DRY_RUN=1",
                  "placeholder": "v0.0.0-dryrun",
                  "flags": "--draft --verify-tag",
                  "ok": draft_ok,
                  "published": False,
              },
              "sbom": {
                  "target": "//deploy/release:sbom_demo",
                  "spdx": "SPDX-2.3",
                  "predicate": "https://slsa.dev/provenance/v1",
                  "verified": True,
                  "published": False,
              },
              "signing_dry_run": {
                  "target": "//deploy/release:signing_demo",
                  "mode": "RELEASE_SIGN_DRY_RUN=1",
                  "trust_root": "https://tuf-repo-cdn.sigstore.dev",
                  "ok": signing_ok,
                  "published": False,
              },
              "bcr_shape": {
                  "module": "rules_dx",
                  "version": "0.0.0",
                  "target": "//deploy/release:bcr_demo",
                  "mode": "BCR_DRY_RUN=1",
                  "checked": True,
                  "submitted": False,
              },
              "verify_refusal": {
                  "verifier": "//deploy/install:dx_verify",
                  "trust_root": "https://tuf-repo-cdn.sigstore.dev",
                  "checksum_only_refused": True,
                  "installed": False,
              },
              "would_publish": [
                  "Bazel Central Registry `rules_dx` module (owner-gated via //deploy/release:bcr_demo; owner approval per issue #5)",
                  "GitHub Release with standalone `dx` binaries (draft only via //cli/cli:github_draft, issue #182; owner approval per issue #5)",
              ],
              "not_attempted": [
                  "SBOM/provenance publishing (generated owner-gated via //deploy/release:sbom_demo; issue #311)",
                  "Signing/attestation publishing (Sigstore keyless + GitHub attestations on the issue #311 trust root, signing-first; GHCR images sign separately via cosign <digest> under issue #460)",
                  "GHCR prebuilt images (separate workflow .github/workflows/ghcr.yml per owner decision; issue #460)",
                  "Non-seed release matrix builds (platforms unqualified; issue #311)",
                  "BCR submission (owner-gated via //deploy/release:bcr_demo; issue #311)",
                  "Any tag, registry submission, or release creation",
              ],
          }
          assert draft_ok, "draft dry-run log missing placeholder or draft-only flags"
          assert signing_ok, "signing dry-run log missing cosign or trust root"
          assert bcr_ok, "bcr dry-run log missing would-submit gate"
          with open(f"{stage}/dry-run-report.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2)
          print(f"seed binary sha256: {digest}")
          print(f"standalone archive sha256: {standalone_digest}")
          print(f"draft dry-run ok: {draft_ok}")
          print(f"signing dry-run ok: {signing_ok}")
          print(f"bcr dry-run ok: {bcr_ok}")
          print(f"approved: {approve}; published: False (dry run never publishes)")
          EOF
          {
            echo "## Publish dry-run report"
            echo ""
            echo "- approved: \`$APPROVE\`; published: **no** (dry run never publishes)"
            echo "- seed binary: \`dx-linux-x86_64\` \`$(cut -d' ' -f1 "$stage/dx-linux-x86_64.sha256")\`"
            echo "- standalone: \`dx-standalone.tar.gz\` \`$(cut -d' ' -f1 "$stage/dx-standalone.tar.gz.sha256")\`"
            echo "- draft dry-run: \`//cli/cli:github_draft\` \`GH_RELEASE_DRY_RUN=1\` ok (placeholder \`v0.0.0-dryrun\`, draft-only flags, publishes nothing)"
            echo "- SBOM: \`//deploy/release:sbom_demo\` SPDX-2.3 + SLSA v1 ok, publishes nothing"
            echo "- signing dry-run: \`//deploy/release:signing_demo\` \`RELEASE_SIGN_DRY_RUN=1\` ok (Sigstore keyless + attestation, publishes nothing)"
            echo "- BCR shape: \`rules_dx\` at \`0.0.0\` via \`//deploy/release:bcr_demo\` checked, not submitted"
            echo "- verifier: checksum-only refused, TUF trust root, nothing installed"
            echo "- full report: \`dry-run-report.json\` in the job logs"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove checkout left clean
        run: test -z "$(git status --porcelain)"
