# Reusable docs CI. This repository cuts no releases; the
# docs-owned caller pins this file at a reviewed commit:
#   uses: rules_dx/.github/workflows/reusable-docs.yml@<commit>
# Reviewed pin bumps only; no silent upgrades. Consumers never copy
# per-check execution or deploy plumbing.
#
# Contract: two checks, Linux-once. `docs-check` runs `dx docs --check`
# plus `dx lint --check` over the caller-selected docs scope; the lint
# pass is the repository-owned Markdown link/structure audit, so broken
# relative targets fail before deploy. `docs-publish` runs only when
# `publish` is true: it uploads `docs_dir` as the Pages artifact and
# deploys it to the `environment` Pages environment. `publish: false`
# is pure check-only. The deployed content is the validated docs tree;
# the rendered mdBook site arrives via issue #10 without changing this
# vehicle.

name: rules-dx-docs

on:
  workflow_call:
    inputs:
      rules_dx_version:
        description: "Pinned rules_dx version (e.g. 0.0.0). Must match the consumer MODULE.bazel pin."
        required: true
        type: string
      docs_scope:
        description: "dx scope covered by docs check and lint (e.g. //docs/...)."
        required: false
        default: "//docs/..."
        type: string
      docs_dir:
        description: "Repository-relative directory uploaded as the Pages artifact when publish is true."
        required: false
        default: "docs"
        type: string
      publish:
        description: "Deploy the validated docs tree to GitHub Pages. False is check-only."
        required: false
        default: false
        type: boolean
      environment:
        description: "Pages environment name for the deploy job."
        required: false
        default: "github-pages"
        type: string

permissions:
  contents: read

concurrency:
  group: dx-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Bazelisk
        run: |
          curl -sL -o /tmp/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  /tmp/bazelisk" | sha256sum -c -
          sudo install -m755 /tmp/bazelisk /usr/local/bin/bazel
          bazel version
      - name: Verify rules_dx pin
        run: test -f MODULE.bazel && grep -q 'version = "${{ inputs.rules_dx_version }}"' MODULE.bazel
      - run: bazel run @rules_dx//dx/cli:dx -- docs --check ${{ inputs.docs_scope }}
      - run: bazel run @rules_dx//dx/cli:dx -- lint --check ${{ inputs.docs_scope }}

  docs-publish:
    name: docs-publish (GitHub Pages)
    needs: [docs-check]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Upload docs tree as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.docs_dir }}
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
