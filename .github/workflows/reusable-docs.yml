# Reusable docs CI. This repository cuts no releases; the
# docs-owned caller pins this file at a reviewed commit:
#   uses: rules_dx/.github/workflows/reusable-docs.yml@<commit>
# Reviewed pin bumps only; no silent upgrades. Consumers never copy
# per-check execution or deploy plumbing.
#
# Contract: one check, Linux-once. `docs-check` runs `dx lint --check`
# over the caller-selected docs scope; the lint
# pass is the repository-owned Markdown link/structure audit, so broken
# relative targets fail before deploy. (`dx docs --check` was removed in
# issue #31: it validated flag shape, not docs content. Issue #581 (live
# successor to closed #421; formerly #421) tracks its
# reintroduction with real extraction/validation.) `docs-publish` runs only when
# `publish` is true: it uploads `docs_dir` as the Pages artifact and
# deploys it to the `environment` Pages environment. `publish: false`
# is pure check-only. The deployed content is the validated docs tree;
# the rendered mdBook site arrives via issue #581 (live successor to closed
# #421; formerly #421) without changing this
# vehicle.
#
# Hygiene (issue #80, deduped under #915): the docs-check bootstrap is
# an inline no-secrets `actions/checkout` (step 1) plus the pinned
# `bazel-contrib/setup-bazel` action (commit SHA plus trailing tag
# comment); every third-party action is pinned to a commit SHA with its
# tag in a trailing comment. The optional BuildBuddy remote cache rides
# the caller-provided `BUILDBUDDY_API_KEY` secret through the workflow
# `BAZEL_CONFIG` plus `BB_ARGS` env on every Bazel plus dx call;
# absent the secret no remote-cache flag is set at all, so Bazel stays
# local-cache only.
# `docs-publish` stages the artifact in a temp dir so the checkout is
# never left dirty for later steps.

name: rules-dx-docs

on:
  workflow_call:
    inputs:
      rules_dx_version:
        description: "Pinned rules_dx version (e.g. 0.0.0). Must match the consumer MODULE.bazel pin."
        required: true
        type: string
      docs_scope:
        description: "dx scope covered by docs check and lint (e.g. //docs/...)."
        required: false
        default: "//docs/..."
        type: string
      docs_dir:
        description: "Repository-relative directory uploaded as the Pages artifact when publish is true."
        required: false
        default: "docs"
        type: string
      publish:
        description: "Deploy the validated docs tree to GitHub Pages. False is check-only."
        required: false
        default: false
        type: boolean
      environment:
        description: "Pages environment name for the deploy job."
        required: false
        default: "github-pages"
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key enabling the shared remote cache. Optional; the job skips remote-cache configuration when absent."
        required: false

permissions:
  contents: read

env:
  # CI flag set (the workspace `.bazelrc` `ci` plus `ci-pr` configs) and
  # the optional BuildBuddy key, passed inline on every Bazel and dx call.
  # No key (fork pull request, or a caller that passes no secret): both
  # stay empty, so no remote-cache flag is set at all and Bazel runs
  # local-cache only. With a key, pull requests stay read-only via
  # `ci-pr` and the header rides inline (never in a committed rc file).
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  # Single-sourced Bazelisk pin for the setup-bazel step in this
  # workflow (kept in sync with .devcontainer/Dockerfile.prebuilt).
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: dx-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: test -f MODULE.bazel && grep -F -q "version = \"$RULES_DX_PIN\"" MODULE.bazel
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- lint --check ${{ inputs.docs_scope }} -- $BAZEL_CONFIG $BB_ARGS
  docs-publish:
    name: docs-publish (GitHub Pages)
    needs: [docs-check]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Stage stopgap Pages entry point in a temp dir
        # The artifact is the raw docs tree (Markdown, no index.html) until
        # the #581 renderer lands. Without an entry point every deployment
        # 404s (issue #30). Stage a copy plus the generated entry point
        # under RUNNER_TEMP so the repo tree stays renderer-clean and the
        # checkout is never left dirty; #581 replaces this with the
        # rendered site.
        env:
          DOCS_DIR: ${{ inputs.docs_dir }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/pages"
          rm -rf "$stage"
          cp -r "$DOCS_DIR" "$stage"
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en">' \
            '<head><meta charset="utf-8"><title>rules_dx docs (preview)</title></head>' \
            '<body>' \
            '<h1>rules_dx docs</h1>' \
            '<p>Rendered site pending <a href="https://github.com/ralvik/rules_dx/issues/581">issue #581</a>.' \
            'Meanwhile the validated docs tree is browsable in the' \
            '<a href="https://github.com/ralvik/rules_dx/tree/main/docs">repository</a>.</p>' \
            '</body>' \
            '</html>' \
            > "$stage/index.html"
          echo "PAGES_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Upload docs tree as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.PAGES_STAGE }}
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Prove checkout left clean
        run: test -z "$(git status --porcelain)"
