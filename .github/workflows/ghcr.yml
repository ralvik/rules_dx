# Prebuilt devcontainer images on GHCR (issues #184, #311).
#
# Separate workflow from releases per owner decision (different lifecycle:
# per-scaffold-change, not per-tag; base-image rebuilds never block/couple
# a `dx` release). Build on PR (paths below), push gated on explicit owner
# approval until standing approval exists. Signing-second after #26/#78
# and selected in #311: `cosign sign <digest>` on the #311 trust root
# (same as //deploy/release:signing_demo) runs owner-gated after push;
# dry-run prints would-sign and signs nothing. Scaffold `image:` digest
# reference follows the first push; GHCR quotas/retention are recorded on
# first push (free for public repos, qualified not assumed per
# docs/testing/README.md).
#
# Hygiene (issue #80): Bazelisk installs go through the single
# `.github/actions/setup-bazelisk` composite action where Bazel is needed;
# this workflow builds Docker only, so the sole third-party action
# (checkout) is pinned to a commit SHA with its tag trailing. No
# `docker/*` actions: plain `docker build`/`push` keeps the push gate
# explicit in `run:` steps. `dist/`/`release/` stay git-ignored per #5.
# Least privilege: top-level permissions stay read-only; only the build
# job below carries `packages: write`, so a future job without explicit
# permissions never inherits push scope.
name: ghcr-prebuilt

on:
  pull_request:
    paths:
      - ".devcontainer/Dockerfile.prebuilt"
      - ".github/workflows/ghcr.yml"
      - ".devcontainer/devcontainer.json"
  workflow_dispatch:
    inputs:
      approve:
        description: "Owner approval to push the prebuilt image to GHCR. False builds and reports only; nothing pushes either way until standing approval exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ghcr-prebuilt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build prebuilt image (no push on PR)
        run: |
          set -euo pipefail
          docker build \
            -f .devcontainer/Dockerfile.prebuilt \
            -t "ghcr.io/${{ github.repository }}/devcontainer:ci-${{ github.sha }}" \
            .
          docker images "ghcr.io/${{ github.repository }}/devcontainer" --digests
      - name: Verify admissibility (pinned bootstrap, Bazel delegation, no ambient tools)
        run: |
          set -euo pipefail
          df=".devcontainer/Dockerfile.prebuilt"
          grep -qE '^FROM [^ ]+@sha256:[0-9a-f]{64}' "$df" \
            || { echo "admissibility: FROM must be digest-pinned (@sha256:), never latest/bare tag"; exit 1; }
          ! grep -qiE 'FROM [^ ]+:latest([ @]|$)' "$df" \
            || { echo "admissibility: :latest is rejected by the pinned-bootstrap gate"; exit 1; }
          grep -q "bazelisk-linux-amd64" "$df" \
            || { echo "admissibility: pre-installed Bazelisk (Bazel delegation) required"; exit 1; }
          grep -q "sha256sum -c" "$df" \
            || { echo "admissibility: Bazelisk fetch must be sha256-checked (pinned bootstrap)"; exit 1; }
          # No ambient language toolchains: tools resolve via Bazel at runtime.
          ! grep -qiE 'pip install|uv pip|npm install -g|pnpm add -g|cargo install|dotnet tool install|go install' "$df" \
            || { echo "admissibility: language toolchains must not be baked in"; exit 1; }
          echo "admissibility: pinned bootstrap + Bazel delegation + no ambient tools (devcontainer_is_admissible(true, true, false))"
      - name: Push to GHCR (owner approval only)
        env:
          APPROVE: ${{ inputs.approve }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "$APPROVE" != "true" ]]; then
            echo "push gate: event=${{ github.event_name }} approve=$APPROVE -> build-only, nothing pushes."
            echo "first push (dispatch + approve:true) publishes ghcr.io/${{ github.repository }}/devcontainer:sha-${{ github.sha }}; scaffold digest ref + cosign sign + quota record follow (#311 signing-second)."
            echo "signing dry-run (RELEASE_SIGN_DRY_RUN=1 equivalent, signs nothing): cosign sign <digest> on the #311 trust root (https://tuf-repo-cdn.sigstore.dev) plus gh attestation create, same selection as //deploy/release:signing_demo."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="ghcr.io/${{ github.repository }}/devcontainer:sha-${{ github.sha }}"
          docker build -f .devcontainer/Dockerfile.prebuilt -t "$tag" .
          docker push "$tag"
          echo "pushed: $tag"
          docker inspect --format='{{index .RepoDigests 0}}' "$tag" || true
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" | cut -d'@' -f2 || echo '<digest>')"
          echo "signing: cosign sign <digest> on the #311 trust root (https://tuf-repo-cdn.sigstore.dev) for $digest plus gh attestation create (owner-approved human-run path, see docs/deploy/release-runbook.md)."
          {
            echo "## GHCR prebuilt push"
            echo ""
            echo "- tag: \`$tag\`"
            echo "- scaffold update (digest ref, never latest) + \`cosign sign <digest>\` on the #311 trust root follow (#311 signing-second, same as //deploy/release:signing_demo)."
            echo "- record GHCR quotas/retention on this first push per docs/testing/README.md."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write job summary (build-only by default)
        if: always()
        run: |
          {
            echo "### ghcr-prebuilt — ${{ job.status }}"
            echo ""
            echo "- base: \`ubuntu:24.04@sha256:69cecf4...\` (pinned digest, resolved 2026-09-17; re-pin deliberately)."
            echo "- Bazel: Bazelisk v1.29.0 (pinned sha256) + Bazel 9.2.0 via USE_BAZEL_VERSION; no ambient toolchains."
            echo "- push: only on workflow_dispatch + approve:true (explicit owner approval); PRs build only."
            echo "- signing: dry-run would-sign \`cosign sign <digest>\` on the #311 trust root plus attestation (same as //deploy/release:signing_demo); real sign follows push."
            echo "- follow-ups (issue #184): scaffold digest ref, quota record."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove checkout left clean
        run: test -z "$(git status --porcelain)"
